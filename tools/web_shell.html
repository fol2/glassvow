<!doctype html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>$GODOT_PROJECT_NAME · Web Dev</title>
	$GODOT_HEAD_INCLUDE
	<style>
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #04050b; }
		body { display: flex; justify-content: center; align-items: flex-start; }
		canvas { width: min(100vw, 143.902439vh); height: min(100vh, 69.491525vw); display: block; outline: none; }
		#status { position: fixed; inset: 0; display: grid; place-items: center; color: #edf2ff; font: 15px system-ui; }
	</style>
</head>
<body>
	<canvas id="canvas" width="1180" height="820" aria-label="Glassvow development surface"></canvas>
	<p id="status" aria-live="polite">Loading Godot Web…</p>
	<noscript>JavaScript is required to run this development surface.</noscript>
	<script src="$GODOT_URL"></script>
	<script>
		const config = $GODOT_CONFIG;
		const status = document.getElementById("status");
		const audio = isSecureContext ? [] : ["--audio-driver", "Dummy"];
		config.args = [...(config.args || []), ...audio, "--", ...new URLSearchParams(location.search).getAll("arg")];
		new Engine(config).startGame({
			onProgress(current, total) {
				status.textContent = total > 0 ? `Loading Godot Web… ${Math.round(current / total * 100)}%` : "Loading Godot Web…";
			},
		}).then(() => status.remove()).catch(error => {
			console.error(error);
			status.textContent = `Godot Web failed: ${error.message || error}`;
		});
	</script>
</body>
</html>
