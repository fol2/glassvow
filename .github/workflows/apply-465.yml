name: Apply issue 465 implementation

on:
  push:
    branches:
      - work/465-asset-profile-authority
    paths:
      - 'tools/_patch_465_*.py'
      - '.github/workflows/apply-465.yml'

permissions:
  contents: write

jobs:
  apply:
    # This workflow removes itself before committing the verified candidate.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/465-asset-profile-authority
          fetch-depth: 0

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install map gate dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python3 -m pip install --quiet 'Pillow>=10,<13'

      - name: Apply exact-source migrations
        run: |
          python3 tools/_patch_465_data.py
          python3 tools/_patch_465_scene.py
          python3 tools/_patch_465_probe.py
          python3 - <<'PY'
          from pathlib import Path

          profile = Path("presentation/map/map_asset_profiles.gd")
          text = profile.read_text()
          old = '''\tfor surface: int in range(mesh.get_surface_count()):
          \t\tcanonical.append(mesh.surface_get_primitive_type(surface))
          \t\tcanonical.append(mesh.surface_get_arrays(surface))'''
          new = '''\tfor surface: int in range(mesh.get_surface_count()):
          \t\tcanonical.append(mesh.surface_get_primitive_type(surface))
          \tcanonical.append(mesh.get_faces())'''
          if text.count(old) != 1:
              raise RuntimeError("profile source-identity patch did not match exactly once")
          text = text.replace(old, new, 1)

          old = '''\telse:
          \t\treturn _polygon_error("footprint must be an array")
          \tif points.size() > 1 and points[0].is_equal_approx(points[points.size() - 1]):'''
          new = '''\telse:
          \t\treturn _polygon_error("footprint must be an array")
          \tfor point: Vector2 in points:
          \t\tif not is_finite(point.x) or not is_finite(point.y):
          \t\t\treturn _polygon_error("point must be finite")
          \tif points.size() > 1 and points[0].is_equal_approx(points[points.size() - 1]):'''
          if text.count(old) != 1:
              raise RuntimeError("packed polygon finite check did not match exactly once")
          profile.write_text(text.replace(old, new, 1))

          scene = Path("presentation/map/map_scene.gd")
          text = scene.read_text()
          comments = {
              "## The fixed −46° yaw is declared by the act1-vigil profile.":
                  "# Fixed yaw comes from the act1-vigil profile.",
              "## The 7.0 world scale is declared by the act1-vigil profile.":
                  "# World scale comes from the act1-vigil profile.",
              "## Road slab default scale is declared by each shared-road profile.":
                  "# Road slab scale comes from the shared-road profiles.",
              "## The current camera-directional hide envelope is owned by MapAssetProfiles.":
                  "# The current camera-directional hide envelope is owned by MapAssetProfiles.",
          }
          for old_comment, new_comment in comments.items():
              if text.count(old_comment) != 1:
                  raise RuntimeError(f"scene comment patch mismatch: {old_comment}")
              text = text.replace(old_comment, new_comment, 1)
          scene.write_text(text)

          tests = Path("tests/test_map_asset_profiles.gd")
          text = tests.read_text()
          replacements = {
              '''\t\t_check(fails,
          \t\t\t\tby_id["shared-road-slab-a"].get("semantic_class")
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_ROAD
          \t\t\t\tand by_id["act1-charred-stump"].get("semantic_class")
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_SCENERY,''':
              '''\t\t_check(fails,
          \t\t\t\tstr(by_id["shared-road-slab-a"].get("semantic_class", ""))
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_ROAD
          \t\t\t\tand str(by_id["act1-charred-stump"].get("semantic_class", ""))
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_SCENERY,''',
              '''\t\t_check(fails,
          \t\t\t\tby_id["act1-vigil"].get("semantic_class")
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_HERO
          \t\t\t\tand by_id["act1-terminus"].get("semantic_class")
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_HERO,''':
              '''\t\t_check(fails,
          \t\t\t\tstr(by_id["act1-vigil"].get("semantic_class", ""))
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_HERO
          \t\t\t\tand str(by_id["act1-terminus"].get("semantic_class", ""))
          \t\t\t\t\t\t== MapAssetProfiles.SEMANTIC_HERO,''',
              '''\t_check(fails, canonical_clockwise.get("points") == canonical_counter.get("points"),
          \t\t\t"clockwise, counter-clockwise and closing/consecutive duplicates canonicalise")''':
              '''\t_check(fails, _packed_vector2_value(canonical_clockwise, "points")
          \t\t\t== _packed_vector2_value(canonical_counter, "points"),
          \t\t\t"clockwise, counter-clockwise and closing/consecutive duplicates canonicalise")''',
              '''static func _bool_value(source: Dictionary, key: String, fallback: bool) -> bool:''':
              '''static func _packed_vector2_value(
          \t\tsource: Dictionary, key: String) -> PackedVector2Array:
          \tvar raw: Variant = source.get(key, PackedVector2Array())
          \tif raw is PackedVector2Array:
          \t\tvar value: PackedVector2Array = raw
          \t\treturn value
          \treturn PackedVector2Array()


          static func _bool_value(source: Dictionary, key: String, fallback: bool) -> bool:''',
          }
          for old_text, new_text in replacements.items():
              if text.count(old_text) != 1:
                  raise RuntimeError("test assertion typing patch did not match exactly once")
              text = text.replace(old_text, new_text, 1)
          tests.write_text(text)
          PY
          rm tools/_patch_465_data.py
          rm tools/_patch_465_scene.py
          rm tools/_patch_465_probe.py
          rm .github/workflows/apply-465.yml
          python3 -m py_compile tools/map_asset_checks.py tools/map_asset_self_test.py
          git diff --check
          echo '--- generated map_scene authority lines ---'
          nl -ba presentation/map/map_scene.gd | sed -n '20,55p'
          echo '--- generated source identity ---'
          nl -ba presentation/map/map_asset_profiles.gd | sed -n '265,295p'
          changed=$(git diff --numstat 52a56e726da70c2dd57254e8c6618682c7558f90 | awk '{a += $1; d += $2} END {print a + d}')
          echo "issue #465 owner-authorised changed lines: ${changed}"

      - name: Verify Godot version
        run: godot --version | grep '^4.7.2.stable'

      - name: Verify imported resources
        run: tools/check_imports.sh

      - name: Verify GDScript warnings as errors
        run: tools/check_scripts.sh

      - name: Verify map asset checker self-tests
        run: python3 -B tools/check_map_assets.py --self-test

      - name: Verify GLB landing self-tests
        run: python3 -B tools/land_map_glb.py --self-test

      - name: Verify production map assets
        run: xvfb-run -a python3 -B tools/check_map_assets.py

      - name: Verify full Godot suite
        run: godot --headless -s res://tests/run_all.gd

      - name: Verify 200 deterministic map seeds
        run: godot --headless -s res://tools/probe_map_seeds.gd -- --seeds=200

      - name: Verify anchors
        run: python3 -B tools/check_anchors.py

      - name: Verify benchmark freeze
        run: python3 -B tools/check_benchmark_freeze.py

      - name: Commit final implementation tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(map): centralize asset footprint profiles (#465)'
          git push origin HEAD:work/465-asset-profile-authority
