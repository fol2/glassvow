name: Apply issue 465 implementation

on:
  push:
    branches:
      - work/465-asset-profile-authority
    paths:
      - 'tools/_patch_465_*.py'
      - 'tools/_patch_465_*.gd'
      - '.github/workflows/apply-465.yml'

permissions:
  contents: write

jobs:
  apply:
    # The verified candidate removes this staging workflow before committing.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/465-asset-profile-authority
          fetch-depth: 0

      - name: Rebase candidate onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install map gate dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python3 -m pip install --quiet 'Pillow>=10,<13'

      - name: Apply exact-source migrations
        run: |
          rm -f tools/_patch_465_geometry_failure.txt
          grep -q 'reads `_seat_kit` rather' tools/_patch_465_scene.py
          sed -i 's/reads `_seat_kit` rather/reads `seat_kit` rather/' tools/_patch_465_scene.py
          python3 tools/_patch_465_data.py
          python3 tools/_patch_465_scene.py
          python3 tools/_patch_465_probe.py
          python3 tools/_patch_465_review.py
          rm tools/_patch_465_data.py
          rm tools/_patch_465_scene.py
          rm tools/_patch_465_probe.py
          rm tools/_patch_465_review.py
          rm .github/workflows/apply-465.yml
          python3 -m py_compile tools/map_asset_checks.py tools/map_asset_self_test.py
          git diff --check
          cat > /tmp/run_465_focus.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var args: PackedStringArray = OS.get_cmdline_user_args()
              if args.size() != 1:
                  print("run_465_focus: expected one static method name")
                  quit(2)
                  return
              var script: Script = load("res://tests/test_map_asset_profiles.gd") as Script
              if script == null:
                  print("run_465_focus: failed to load focused test")
                  quit(2)
                  return
              var fails: Array[String] = []
              var method_name: StringName = StringName(args[0])
              script.call(method_name, fails)
              if fails.is_empty():
                  print("PASS %s" % method_name)
                  quit(0)
                  return
              print("FAIL %s (%d)" % [method_name, fails.size()])
              for message: String in fails:
                  print("  - %s" % message)
              quit(1)
          GDSCRIPT
          changed=$(git diff --numstat origin/main | awk '{a += $1; d += $2} END {print a + d}')
          echo "issue #465 owner-authorised changed lines: ${changed}"

      - name: Verify Godot version
        run: godot --version | grep '^4.7.2.stable'

      - name: Verify imported resources
        run: tools/check_imports.sh

      - name: Verify GDScript warnings as errors
        run: tools/check_scripts.sh

      - name: Verify map asset checker self-tests
        run: python3 -B tools/check_map_assets.py --self-test

      - name: Verify GLB landing self-tests
        run: python3 -B tools/land_map_glb.py --self-test

      - name: Verify registry manifest count
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- manifest-count

      - name: Verify registry profile generation
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- generation-count

      - name: Verify registry required fields
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- required-fields

      - name: Verify registry active-act residency
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- act-residency

      - name: Verify registry semantic classes
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- semantics

      - name: Verify registry digest
        run: godot --headless -s res://tools/_patch_465_registry_probe.gd -- digest

      - name: Remove staging-only registry probe
        run: rm tools/_patch_465_registry_probe.gd

      - name: Verify production map assets
        run: xvfb-run -a python3 -B tools/check_map_assets.py

      - name: Verify profile live registry
        run: godot --headless --path . --script /tmp/run_465_focus.gd -- _live_profiles

      - name: Verify profile geometry contract
        run: |
          set +e
          godot --headless --path . --script /tmp/run_465_focus.gd -- _geometry_contract 2>&1 | tee /tmp/geometry.log
          rc=${PIPESTATUS[0]}
          while IFS= read -r line; do
            case "$line" in
              "  - "*) echo "::error title=profile geometry contract::${line#  - }" ;;
            esac
          done < /tmp/geometry.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/geometry.log tools/_patch_465_geometry_failure.txt
            git add tools/_patch_465_geometry_failure.txt
            git commit -m 'ci(#465): capture geometry contract failure'
            git push --force-with-lease origin HEAD:work/465-asset-profile-authority
          fi
          exit "$rc"

      - name: Verify profile runtime digest
        run: godot --headless --path . --script /tmp/run_465_focus.gd -- _runtime_digest

      - name: Verify full Godot suite
        run: godot --headless -s res://tests/run_all.gd

      - name: Verify 200 deterministic map seeds
        run: godot --headless -s res://tools/probe_map_seeds.gd -- --seeds=200

      - name: Verify anchors
        run: python3 -B tools/check_anchors.py

      - name: Verify benchmark freeze
        run: python3 -B tools/check_benchmark_freeze.py

      - name: Commit final implementation tree
        run: |
          git add -A
          git commit -m 'feat(map): centralize asset footprint profiles (#465)'
          git push --force-with-lease origin HEAD:work/465-asset-profile-authority
