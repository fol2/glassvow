name: Linux execution provenance evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evidence mode
        required: true
        type: choice
        default: inert
        options:
          - inert
          - godot-g0
          - godot-runtime
          - godot-runtime-a1
      product_sha:
        description: Exact current-main product commit for a Godot run
        required: false
        type: string
      packet_sha:
        description: Exact research-packet commit for a Godot run
        required: false
        type: string
      packet_ref:
        description: Ephemeral A1-v2 packet branch bound to packet_sha
        required: false
        type: string
      packet_root:
        description: Declared research-packet directory
        required: false
        type: string
      authority_comment:
        description: Issue-authority comment database id
        required: false
        type: string
      request_index:
        description: Exact packet-declared request index for an A1 invocation
        required: false
        type: string
        default: '0'
      capability_run:
        description: Exact-main #535 qualification run required by A1 ingress
        required: false
        type: string
      capability_receipt_sha256:
        description: Exact-main #535 campaign receipt required by A1 ingress
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/execution-provenance-evidence.yml'
      - 'tools/execution_provenance/**'
      - 'tests/test_execution_provenance.py'
      - 'tests/test_godot_runtime_*.py'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: execution-provenance-${{ inputs.mode == 'godot-runtime' && 'godot-runtime' || inputs.mode == 'godot-runtime-a1' && 'godot-runtime-a1' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.mode != 'godot-runtime' && inputs.mode != 'godot-runtime-a1' }}

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'inert'
    name: Qualify bounded ptrace evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner image and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/execution-provenance
          {
            printf 'git_head=%s\n' "$(git rev-parse HEAD)"
            printf 'ImageOS=%s\n' "${ImageOS:-missing}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-missing}"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'ptrace_scope=%s\n' "$(cat /proc/sys/kernel/yama/ptrace_scope)"
          } > artifacts/execution-provenance/environment.txt

      - name: Test deterministic preflight validation
        run: python3 -B tests/test_execution_provenance.py

      - name: Measure B0 on the actual runner
        run: |
          python3 -B tools/execution_provenance/preflight.py \
            --output artifacts/execution-provenance/b0-preflight.json

      - name: Check exact-head pre-execution review
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          protocol_sha="$(sha256sum tools/execution_provenance/protocol.json | cut -d' ' -f1)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          authority_issue="$(python3 -c 'import json; print(json.load(open("tools/execution_provenance/protocol.json"))["authority"]["issue"])')"
          head_marker="EXECUTION_PROVENANCE_PREEXECUTION_APPROVE head=$HEAD_SHA tree=$tree_sha protocol_sha256=$protocol_sha"
          tree_marker="EXECUTION_PROVENANCE_REVIEWED_TREE tree=$tree_sha protocol_sha256=$protocol_sha"
          review_comments="$RUNNER_TEMP/execution-provenance-review-comments.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$authority_issue/comments" \
            --jq '.[] | select(.author_association == "OWNER") | .body' \
            > "$review_comments"
          if [[ "$EVENT_NAME" == "pull_request" ]] \
              && grep -Fxq "$head_marker" "$review_comments"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "main" ]] \
              && grep -Fxq "$tree_marker" "$review_comments"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "B2 withheld: no independent exact-head or exact-main-tree review marker."
          fi

      - name: Run frozen B1/B2 qualification campaign
        if: steps.review.outputs.approved == 'true'
        run: |
          python3 -B tools/execution_provenance/campaign.py \
            --protocol tools/execution_provenance/protocol.json \
            --output artifacts/execution-provenance/b2

      - name: Upload capability receipts and raw diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-provenance-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/execution-provenance
          if-no-files-found: error
          retention-days: 14

  godot-g0:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'godot-g0'
    name: Measure actual Godot path (G0 only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
      GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_BINARY_SHA256: 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e
      EXPECTED_PRODUCT_SHA: 5c5f2d325725b0a04e060c1ffe0b40a76f2e0928
      EXPECTED_AUTHORITY_COMMENT: '5524343289'
      EXPECTED_PACKET_ROOT: research_packets/issue-421-a1-v2-g0
    steps:
      - name: Check out exact observer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable product and packet ingress
        shell: bash
        env:
          PRODUCT_SHA: ${{ inputs.product_sha }}
          PACKET_SHA: ${{ inputs.packet_sha }}
          PACKET_ROOT: ${{ inputs.packet_root }}
          AUTHORITY_COMMENT: ${{ inputs.authority_comment }}
        run: |
          set -euo pipefail
          test "$PRODUCT_SHA" = "$EXPECTED_PRODUCT_SHA"
          test "$AUTHORITY_COMMENT" = "$EXPECTED_AUTHORITY_COMMENT"
          test "$PACKET_ROOT" = "$EXPECTED_PACKET_ROOT"
          [[ "$PACKET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$PRODUCT_SHA" "$PACKET_SHA"
          test "$(git rev-parse "$PACKET_SHA^")" = "$PRODUCT_SHA"
          test -z "$(git diff --no-renames --name-only "$PRODUCT_SHA" "$PACKET_SHA" -- . \
            | grep -Ev "^${PACKET_ROOT}/" || true)"
          changed="$(git diff --no-renames --name-only "$PRODUCT_SHA" "$PACKET_SHA" -- "$PACKET_ROOT")"
          test "$changed" = "${PACKET_ROOT}/corpus.json
          ${PACKET_ROOT}/manifest.json
          ${PACKET_ROOT}/p9_v5_runtime_oracle.gd"
          git worktree add --detach "$RUNNER_TEMP/g0-product" "$PRODUCT_SHA"
          git worktree add --detach "$RUNNER_TEMP/g0-packet" "$PACKET_SHA"
          python3 -B - "$RUNNER_TEMP/g0-packet/$PACKET_ROOT/manifest.json" \
            "$PRODUCT_SHA" "$PACKET_SHA" "$AUTHORITY_COMMENT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              "schema": "glassvow.p9-a1-v2-g0-packet/v1",
              "productSha": sys.argv[2],
              "authorityIssue": 535,
              "authorityComment": int(sys.argv[4]),
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"packet manifest {key} mismatch")
          root = manifest_path.parent
          roles = manifest.get("roles")
          if not isinstance(roles, dict) or set(roles) != {"externalScript", "corpus"}:
              raise SystemExit("packet role set mismatch")
          expected_roles = {
              "externalScript": ("p9_v5_runtime_oracle.gd", "37fe74e4c2319e393f963139e3db300353956a025e6d3724cb4f83d8265f56e7"),
              "corpus": ("corpus.json", "ffaa165e59ee5cd59df3f7476932ec30938d27abf8a85f8f41667f4de5ee696a"),
          }
          for role, (path, digest) in expected_roles.items():
              if roles[role] != {"path": path, "sha256": digest}:
                  raise SystemExit(f"packet role mismatch: {role}")
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"packet bytes mismatch: {role}")
          PY

      - name: Install and identify exact Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/godot-g0
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_ZIP_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod 0555 "$RUNNER_TEMP/godot/godot"
          echo "$GODOT_BINARY_SHA256  $RUNNER_TEMP/godot/godot" | sha256sum --check --strict
          {
            printf 'observer_head=%s\n' "$(git rev-parse HEAD)"
            printf 'product_sha=%s\n' '${{ inputs.product_sha }}'
            printf 'packet_sha=%s\n' '${{ inputs.packet_sha }}'
            printf 'packet_root=%s\n' '${{ inputs.packet_root }}'
            printf 'authority_comment=%s\n' '${{ inputs.authority_comment }}'
            printf 'ImageOS=%s\n' "${ImageOS:-missing}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-missing}"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'ptrace_scope=%s\n' "$(cat /proc/sys/kernel/yama/ptrace_scope)"
            printf 'strace=%s\n' "$(strace --version | head -n 1)"
            printf 'godot_version=%s\n' "$("$RUNNER_TEMP/godot/godot" --version)"
            printf 'godot_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/godot/godot" | cut -d' ' -f1)"
          } > artifacts/godot-g0/environment.txt
          python3 -B - "$RUNNER_TEMP/godot/godot" /usr/bin/env /bin/sh <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import sys

          interpreters = {}
          for executable in map(pathlib.Path, sys.argv[1:]):
              output = subprocess.run(
                  ["readelf", "--program-headers", str(executable)],
                  check=True, capture_output=True, text=True).stdout
              match = re.search(r"Requesting program interpreter:\s*([^\]]+)\]", output)
              if match is None:
                  raise SystemExit(f"missing PT_INTERP for {executable}")
              requested = pathlib.Path(match.group(1))
              resolved = requested.resolve(strict=True)
              data = resolved.read_bytes()
              identity = {
                  "path": str(resolved), "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
              existing = interpreters.setdefault(
                  str(resolved), {**identity, "requestedPaths": set()})
              if any(existing[key] != value for key, value in identity.items()):
                  raise SystemExit("interpreter identity differs between executables")
              existing["requestedPaths"].add(str(requested))
          records = [{**record, "requestedPaths": sorted(record["requestedPaths"])}
                     for record in interpreters.values()]
          pathlib.Path("artifacts/godot-g0/elf-interpreters.json").write_text(
              json.dumps(records, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          PY

      - name: Generate measured Godot cache outside the traced invocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g0-home" artifacts/godot-g0/cache-preflight/raw
          /usr/bin/env -i /usr/bin/strace -ff -qq -ttt -T -yy -s 4096 \
            -o artifacts/godot-g0/cache-preflight/raw/trace \
            /usr/bin/env -i HOME="$RUNNER_TEMP/g0-home" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            "$RUNNER_TEMP/godot/godot" --headless --editor \
            --path "$RUNNER_TEMP/g0-product" --quit \
            > artifacts/godot-g0/cache-preflight/stdout.txt \
            2> artifacts/godot-g0/cache-preflight/stderr.txt
          test -f "$RUNNER_TEMP/g0-product/.godot/global_script_class_cache.cfg"
          sha256sum "$RUNNER_TEMP/g0-product/.godot/global_script_class_cache.cfg" \
            > artifacts/godot-g0/cache-preflight/global-script-cache.sha256
          mkdir artifacts/godot-g0/cache-preflight/roles
          for role in extension_list.cfg global_script_class_cache.cfg uid_cache.bin; do
            install -m 0444 "$RUNNER_TEMP/g0-product/.godot/$role" \
              "artifacts/godot-g0/cache-preflight/roles/$role"
          done
          sha256sum artifacts/godot-g0/cache-preflight/roles/* \
            > artifacts/godot-g0/cache-preflight/roles.sha256
          chmod -R a-w "$RUNNER_TEMP/g0-product" "$RUNNER_TEMP/g0-packet"

      - name: Trace one actual baseline Godot invocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-g0/raw artifacts/godot-g0/run "$RUNNER_TEMP/g0-runtime-home"
          product="$RUNNER_TEMP/g0-product"
          packet="$RUNNER_TEMP/g0-packet/${{ inputs.packet_root }}"
          output="$GITHUB_WORKSPACE/artifacts/godot-g0/run/observation.json"
          /usr/bin/env -i /usr/bin/strace -ff -qq -ttt -T -yy -s 4096 \
            -o artifacts/godot-g0/raw/trace \
            /usr/bin/env -i HOME="$RUNNER_TEMP/g0-runtime-home" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            "$RUNNER_TEMP/godot/godot" --headless --path "$product" \
            -s "$packet/p9_v5_runtime_oracle.gd" -- \
            --input "$packet/corpus.json" --index 0 --output "$output" \
            > artifacts/godot-g0/stdout.txt \
            2> artifacts/godot-g0/stderr.txt
          test -s "$output"
          test ! -s artifacts/godot-g0/stderr.txt
          sha256sum "$output" > artifacts/godot-g0/output.sha256
          test "$(cut -d' ' -f1 artifacts/godot-g0/output.sha256)" = \
            '8df7ba42b663e7bfe0a12b7ca9d817d6fd678f754e726b8cf6241d0c065ec435'

      - name: Summarise actual access mechanisms
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G 'artifacts/godot-g0/raw/trace.*' > /dev/null; then
            exit 0
          fi
          python3 -B - "$RUNNER_TEMP/g0-product" \
            "$RUNNER_TEMP/g0-packet/${{ inputs.packet_root }}" \
            "$RUNNER_TEMP/godot/godot" \
            "$RUNNER_TEMP/g0-runtime-home" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          roots = {
              "${PRODUCT}": pathlib.Path(sys.argv[1]),
              "${PACKET}": pathlib.Path(sys.argv[2]),
              "${GODOT}": pathlib.Path(sys.argv[3]),
              "${HOME}": pathlib.Path(sys.argv[4]),
              "${OUTPUT}": pathlib.Path.cwd() / "artifacts/godot-g0",
          }
          observed = {}
          for trace in sorted(pathlib.Path("artifacts/godot-g0/raw").glob("trace.*")):
              for line in trace.read_text(encoding="utf-8", errors="replace").splitlines():
                  call = re.match(r"[0-9.]+ ([A-Za-z0-9_]+)\(", line)
                  if not call:
                      continue
                  paths = re.findall(r"[0-9]+<([^>]+)>", line)
                  if call.group(1) == "execve":
                      executable = re.search(r'execve\("([^"\n]+)"', line)
                      if executable:
                          paths.append(executable.group(1))
                  for raw_path in paths:
                      if not raw_path.startswith("/"):
                          continue
                      path = pathlib.Path(raw_path.split("<", 1)[0])
                      try:
                          is_file = path.is_file()
                      except OSError:
                          continue
                      if not is_file:
                          continue
                      observed.setdefault(str(path), set()).add(call.group(1))

          records = []
          for raw_path, operations in sorted(observed.items()):
              path = pathlib.Path(raw_path)
              normalised = raw_path
              for label, root in roots.items():
                  try:
                      suffix = path.relative_to(root)
                  except ValueError:
                      continue
                  normalised = label if str(suffix) == "." else f"{label}/{suffix}"
                  break
              records.append({
                  "path": normalised,
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "operations": sorted(operations),
              })
          pathlib.Path("artifacts/godot-g0/consumed-files.json").write_text(
              json.dumps(records, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          {
            printf 'trace_files=%s\n' "$(find artifacts/godot-g0/raw -type f -name 'trace.*' | wc -l)"
            printf 'trace_bytes=%s\n' "$(du -cb artifacts/godot-g0/raw/trace.* | tail -n 1 | cut -f1)"
            printf 'external_script_events=%s\n' "$(grep -hF 'p9_v5_runtime_oracle.gd' artifacts/godot-g0/raw/trace.* | wc -l || true)"
            printf 'corpus_events=%s\n' "$(grep -hF 'corpus.json' artifacts/godot-g0/raw/trace.* | wc -l || true)"
            printf 'project_events=%s\n' "$(grep -hF "$RUNNER_TEMP/g0-product" artifacts/godot-g0/raw/trace.* | wc -l || true)"
            printf 'network_syscall_events=%s\n' "$(grep -hE ' (socket|connect|accept|bind|listen|sendto|recvfrom)\(' artifacts/godot-g0/raw/trace.* | wc -l || true)"
          } > artifacts/godot-g0/summary.txt
          grep -hE 'p9_v5_runtime_oracle\.gd|corpus\.json|full-content\.json|mob-overrides\.json|line-table\.json|global_script_class_cache\.cfg' \
            artifacts/godot-g0/raw/trace.* > artifacts/godot-g0/semantic-events.txt || true

      - name: Upload non-authoritative G0 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-g0-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/godot-g0
          if-no-files-found: error
          retention-days: 14

  godot-runtime:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'godot-runtime' || inputs.mode == 'godot-runtime-a1')
    name: ${{ inputs.mode == 'godot-runtime' && 'Qualify actual Godot runtime profile' || 'Execute admitted A1 Godot packet' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
      GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_BINARY_SHA256: 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e
      PRODUCT_SHA: ${{ inputs.product_sha }}
      PACKET_SHA: ${{ inputs.packet_sha }}
      PACKET_REF: ${{ inputs.packet_ref }}
      PACKET_ROOT: ${{ inputs.packet_root }}
      AUTHORITY_COMMENT: ${{ inputs.authority_comment }}
      REQUEST_INDEX: ${{ inputs.request_index }}
      EXECUTION_MODE: ${{ inputs.mode }}
      CAPABILITY_RUN: ${{ inputs.capability_run }}
      CAPABILITY_RECEIPT_SHA256: ${{ inputs.capability_receipt_sha256 }}
    steps:
      - name: Check out exact trusted observer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve finite remote qualification budget
        if: inputs.mode == 'godot-runtime'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-runtime
          read -r max_attempts per_attempt max_minutes < <(python3 -B - <<'PY'
          import json
          profile = json.load(open(
              "tools/execution_provenance/godot_runtime_profile.json",
              encoding="utf-8"))
          caps = profile["caps"]
          print(caps["maxQualificationAttempts"],
                caps["maxMinutesPerQualificationAttempt"],
                caps["maxHostedMinutes"])
          PY
          )
          test "$((max_attempts * per_attempt))" -eq "$max_minutes"
          runs_file="$RUNNER_TEMP/godot-runtime-runs.txt"
          jobs_file="$RUNNER_TEMP/godot-runtime-jobs.txt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/execution-provenance-evidence.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "$runs_file"
          mapfile -t runs < "$runs_file"
          attempts=0
          : > "$RUNNER_TEMP/godot-runtime-attempts.txt"
          for run_id in "${runs[@]}"; do
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Qualify actual Godot runtime profile") | "\(.id):\(.run_attempt)"' \
              > "$jobs_file"
            mapfile -t jobs < "$jobs_file"
            attempts=$((attempts + ${#jobs[@]}))
            for job in "${jobs[@]}"; do
              printf '%s:%s\n' "$run_id" "$job" \
                >> "$RUNNER_TEMP/godot-runtime-attempts.txt"
            done
          done
          current_count="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Qualify actual Godot runtime profile")] | length')"
          test "$current_count" -eq 1
          grep -Eq "^${GITHUB_RUN_ID}:[0-9]+:${GITHUB_RUN_ATTEMPT}$" \
            "$RUNNER_TEMP/godot-runtime-attempts.txt"
          test "$attempts" -ge 1
          test "$attempts" -le "$max_attempts"
          python3 -B - "$RUNNER_TEMP/godot-runtime-attempts.txt" \
            "$attempts" "$max_attempts" "$per_attempt" "$max_minutes" <<'PY'
          import json
          import pathlib
          import sys

          identities = pathlib.Path(sys.argv[1]).read_text(
              encoding="utf-8").splitlines()
          receipt = {
              "attemptIdentities": identities,
              "attemptsReserved": int(sys.argv[2]),
              "maxAttempts": int(sys.argv[3]),
              "reservedMinutesPerAttempt": int(sys.argv[4]),
              "maxHostedMinutes": int(sys.argv[5]),
          }
          pathlib.Path("artifacts/godot-runtime/budget.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8")
          PY

      - name: Validate current-main product, packet and owner authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-runtime
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUTHORITY_COMMENT" =~ ^[0-9]+$ ]]
          python3 -B - "$PACKET_ROOT" <<'PY'
          from pathlib import PurePosixPath
          import sys

          raw = sys.argv[1]
          path = PurePosixPath(raw)
          if (not raw or path.as_posix() != raw or len(path.parts) < 2
                  or path.parts[0] != "research_packets"
                  or any(part in {"", ".", ".."} for part in path.parts)):
              raise SystemExit("unsafe packet root")
          PY
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$PRODUCT_SHA" = "$remote_main"
          if [[ "$EXECUTION_MODE" == "godot-runtime-a1" ]]; then
            test "$GITHUB_REF_NAME" = main
            test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          fi
          git fetch --no-tags origin "$PRODUCT_SHA"
          if [[ "$EXECUTION_MODE" == "godot-runtime-a1" ]]; then
            python3 -B - "$PACKET_REF" <<'PY'
          import re
          import sys

          value = sys.argv[1]
          prefix = "refs/heads/p9-packet-421-a1-v2-"
          suffix = value.removeprefix(prefix)
          if (not value.startswith(prefix)
                  or not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,63}", suffix)
                  or ".." in value or value.endswith(".")):
              raise SystemExit("unsafe A1-v2 packet ref")
          PY
            packet_ref_rows="$RUNNER_TEMP/godot-runtime-packet-ref.txt"
            git ls-remote --refs origin "$PACKET_REF" > "$packet_ref_rows"
            test "$(wc -l < "$packet_ref_rows")" -eq 1
            read -r packet_ref_sha packet_ref_name < "$packet_ref_rows"
            test "$packet_ref_sha" = "$PACKET_SHA"
            test "$packet_ref_name" = "$PACKET_REF"
            git fetch --no-tags origin "$PACKET_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$PACKET_SHA"
          else
            test -z "$PACKET_REF"
            git fetch --no-tags origin "$PACKET_SHA"
          fi
          read -ra parents <<< "$(git rev-list --parents -n 1 "$PACKET_SHA")"
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$PRODUCT_SHA"
          git diff --no-renames --name-only -z "$PRODUCT_SHA" "$PACKET_SHA" -- . \
            > "$RUNNER_TEMP/godot-runtime-changed-paths"
          python3 -B - "$PACKET_ROOT" "$RUNNER_TEMP/godot-runtime-changed-paths" <<'PY'
          import pathlib
          import sys

          root = sys.argv[1] + "/"
          paths = pathlib.Path(sys.argv[2]).read_bytes().split(b"\0")
          changed = [path.decode("utf-8") for path in paths if path]
          if not changed or any(not path.startswith(root) for path in changed):
              raise SystemExit("packet commit changes a path outside its declared root")
          PY
          packet_tree="$RUNNER_TEMP/godot-runtime-packet-tree"
          git ls-tree -r -z -l "$PACKET_SHA" -- "$PACKET_ROOT" > "$packet_tree"
          python3 -B - "$PACKET_ROOT" "$packet_tree" \
            tools/execution_provenance/godot_runtime_profile.json <<'PY'
          import json
          import pathlib
          import sys

          root = sys.argv[1].encode("utf-8") + b"/"
          records = [record for record in pathlib.Path(sys.argv[2]).read_bytes().split(b"\0") if record]
          caps = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))["caps"]
          members = {}
          total = 0
          for record in records:
              try:
                  metadata, path = record.split(b"\t", 1)
                  mode, kind, _object, size = metadata.split()
                  if not path.startswith(root):
                      raise ValueError
                  relative = path[len(root):].decode("utf-8")
                  length = int(size)
              except (UnicodeError, ValueError):
                  raise SystemExit("malformed packet tree record")
              if mode != b"100644" or kind != b"blob" or not relative or "/" in relative:
                  raise SystemExit("packet tree contains a non-direct regular data member")
              if relative in members:
                  raise SystemExit("packet tree contains a duplicate member")
              members[relative] = length
              total += length
          if len(members) != 3 or "manifest.json" not in members:
              raise SystemExit("packet tree must contain exactly three direct members")
          if len(members) > caps["maxPacketMembers"] or total > caps["maxPacketBytes"]:
              raise SystemExit("packet tree exceeds its frozen cap")
          if members["manifest.json"] > caps["maxPacketManifestBytes"]:
              raise SystemExit("packet manifest exceeds its frozen cap")
          PY
          git worktree add --detach "$RUNNER_TEMP/godot-product" "$PRODUCT_SHA"
          mkdir "$RUNNER_TEMP/godot-packet"
          git archive --format=tar "$PACKET_SHA" "$PACKET_ROOT" \
            | tar -xf - -C "$RUNNER_TEMP/godot-packet"
          python3 -B - "$RUNNER_TEMP/godot-packet/$PACKET_ROOT" \
            "$PRODUCT_SHA" "$PACKET_ROOT" "$AUTHORITY_COMMENT" "$EXECUTION_MODE" <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys

          packet = pathlib.Path(sys.argv[1]).resolve()
          product_sha, packet_root = sys.argv[2], sys.argv[3]
          authority_comment, mode = int(sys.argv[4]), sys.argv[5]
          source = pathlib.Path("tools/execution_provenance/godot_runtime_runner.py")
          spec = importlib.util.spec_from_file_location("godot_runtime_runner", source)
          if spec is None or spec.loader is None:
              raise SystemExit("trusted packet validator unavailable")
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          profile, _ = runner.validate_frozen_sources()
          manifest = runner.read_packet_manifest(packet, profile)
          authority_issue = manifest.get("authorityIssue")
          ingress_name = "qualification" if mode == "godot-runtime" else "research"
          ingress = profile["packetIngress"][ingress_name]
          if authority_issue != int(ingress["authorityIssue"]):
              raise SystemExit(f"{ingress_name} packet authority issue mismatch")
          if authority_comment != int(ingress["authorityComment"]):
              raise SystemExit(f"{ingress_name} packet authority mismatch")
          runner.validate_packet_manifest(
              packet, manifest, profile, product_sha=product_sha,
              packet_root=packet_root, authority_issue=authority_issue,
              authority_comment=authority_comment)
          request_index = __import__("os").environ["REQUEST_INDEX"]
          if request_index not in manifest["requestIndices"]:
              raise SystemExit("requested packet index is not declared")
          pathlib.Path("artifacts/godot-runtime/ingress.json").write_text(
              json.dumps({
                  "authorityIssue": authority_issue,
                  "authorityComment": authority_comment,
                  "observerSha": __import__("subprocess").check_output(
                      ["git", "rev-parse", "HEAD"], text=True).strip(),
                  "productSha": product_sha,
                  "packetSha": __import__("os").environ["PACKET_SHA"],
                  "packetRoot": packet_root,
                  "requestIndex": request_index,
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8")
          PY
          authority_issue="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["authorityIssue"])' \
            artifacts/godot-runtime/ingress.json)"
          comment_json="$RUNNER_TEMP/godot-runtime-authority.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTHORITY_COMMENT" \
            > "$comment_json"
          python3 -B - "$comment_json" "$authority_issue" "$AUTHORITY_COMMENT" <<'PY'
          import json
          import sys

          record = json.load(open(sys.argv[1], encoding="utf-8"))
          issue, comment = int(sys.argv[2]), int(sys.argv[3])
          if record.get("id") != comment or record.get("author_association") != "OWNER":
              raise SystemExit("packet authority comment is not owner-authored")
          if not record.get("issue_url", "").endswith(f"/issues/{issue}"):
              raise SystemExit("packet authority comment belongs to another issue")
          PY

      - name: Check exact-main #535 capability prerequisite
        if: inputs.mode == 'godot-runtime-a1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CAPABILITY_RUN" =~ ^[0-9]+$ ]]
          [[ "$CAPABILITY_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          profile_sha="$(sha256sum tools/execution_provenance/godot_runtime_profile.json | cut -d' ' -f1)"
          manifest_sha="$(sha256sum tools/execution_provenance/godot_runtime_g0_manifest.json | cut -d' ' -f1)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          marker="GODOT_RUNTIME_EXACT_MAIN_PASS head=$PRODUCT_SHA tree=$tree_sha profile_sha256=$profile_sha manifest_sha256=$manifest_sha run=$CAPABILITY_RUN receipt_sha256=$CAPABILITY_RECEIPT_SHA256"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/535/comments" \
            --jq '.[] | select(.author_association == "OWNER") | .body' \
            | grep -Fxq "$marker"
          run_json="$RUNNER_TEMP/godot-runtime-capability-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPABILITY_RUN" > "$run_json"
          python3 -B - "$run_json" "$CAPABILITY_RUN" "$PRODUCT_SHA" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          if run.get("id") != int(sys.argv[2]) or run.get("head_sha") != sys.argv[3]:
              raise SystemExit("capability run identity differs")
          if run.get("event") != "workflow_dispatch" or run.get("conclusion") != "success":
              raise SystemExit("capability run did not complete successfully")
          if run.get("head_branch") != "main" or not str(run.get("path", "")).startswith(
                  ".github/workflows/execution-provenance-evidence.yml"):
              raise SystemExit("capability run is not the exact-main specialist workflow")
          PY
          run_attempt="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_attempt"])' "$run_json")"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          artifact_name="godot-runtime-${PRODUCT_SHA}-${run_attempt}"
          capability="$RUNNER_TEMP/godot-runtime-capability"
          gh run download "$CAPABILITY_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$capability"
          prerequisite="$RUNNER_TEMP/godot-runtime-capability-prerequisite.json"
          python3 -B - "$capability/qualification/campaign-receipt.json" \
            "$CAPABILITY_RECEIPT_SHA256" "$prerequisite" "$CAPABILITY_RUN" \
            "$run_attempt" "$artifact_name" "$PRODUCT_SHA" "$tree_sha" \
            "$profile_sha" "$manifest_sha" <<'PY'
          import pathlib
          import sys
          from tools.execution_provenance import godot_runtime_campaign as campaign

          campaign.validate_capability_receipt(pathlib.Path(sys.argv[1]), sys.argv[2])
          campaign.write_json(pathlib.Path(sys.argv[3]), {
              "schema": campaign.CAPABILITY_SCHEMA,
              "capabilityRun": int(sys.argv[4]),
              "capabilityRunAttempt": int(sys.argv[5]),
              "capabilityArtifact": sys.argv[6],
              "capabilityReceiptSha256": sys.argv[2],
              "observerSha": sys.argv[7], "productSha": sys.argv[7],
              "treeSha": sys.argv[8], "profileSha256": sys.argv[9],
              "g0ManifestSha256": sys.argv[10],
          })
          PY

      - name: Install and identify exact Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_ZIP_SHA256  $RUNNER_TEMP/godot/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$RUNNER_TEMP/godot/godot"
          chmod 0555 "$RUNNER_TEMP/godot/godot"
          echo "$GODOT_BINARY_SHA256  $RUNNER_TEMP/godot/godot" | sha256sum --check --strict
          {
            printf 'observer_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'product_sha=%s\n' "$PRODUCT_SHA"
            printf 'packet_sha=%s\n' "$PACKET_SHA"
            printf 'packet_root=%s\n' "$PACKET_ROOT"
            printf 'authority_comment=%s\n' "$AUTHORITY_COMMENT"
            printf 'profile_sha256=%s\n' "$(sha256sum tools/execution_provenance/godot_runtime_profile.json | cut -d' ' -f1)"
            printf 'g0_manifest_sha256=%s\n' "$(sha256sum tools/execution_provenance/godot_runtime_g0_manifest.json | cut -d' ' -f1)"
            printf 'ImageOS=%s\n' "${ImageOS:-missing}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-missing}"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'uname=%s\n' "$(uname -a)"
            printf 'ptrace_scope=%s\n' "$(cat /proc/sys/kernel/yama/ptrace_scope)"
            printf 'godot_version=%s\n' "$("$RUNNER_TEMP/godot/godot" --version)"
            printf 'godot_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/godot/godot" | cut -d' ' -f1)"
          } > artifacts/godot-runtime/environment.txt

      - name: Run focused profile regressions
        run: |
          python3 -B tests/test_execution_provenance.py
          python3 -B tests/test_godot_runtime_provenance.py
          python3 -B tests/test_godot_runtime_trace_binding.py
          python3 -B tests/test_godot_runtime_workflow.py

      - name: Check frozen exact-head or exact-main review
        if: inputs.mode == 'godot-runtime'
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          profile_sha="$(sha256sum tools/execution_provenance/godot_runtime_profile.json | cut -d' ' -f1)"
          manifest_sha="$(sha256sum tools/execution_provenance/godot_runtime_g0_manifest.json | cut -d' ' -f1)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          head_marker="GODOT_RUNTIME_PREEXECUTION_APPROVE head=$HEAD_SHA tree=$tree_sha profile_sha256=$profile_sha manifest_sha256=$manifest_sha"
          tree_marker="GODOT_RUNTIME_REVIEWED_TREE tree=$tree_sha profile_sha256=$profile_sha manifest_sha256=$manifest_sha"
          comments="$RUNNER_TEMP/godot-runtime-review-comments.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/535/comments" \
            --jq '.[] | select(.author_association == "OWNER") | .body' > "$comments"
          if [[ "$REF_NAME" == "main" ]] && grep -Fxq "$tree_marker" "$comments"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" != "main" ]] && grep -Fxq "$head_marker" "$comments"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
            echo "G2 withheld: no independent frozen exact-head or exact-main-tree marker."
          fi

      - name: Requalify unchanged inert profile
        if: inputs.mode == 'godot-runtime' && steps.review.outputs.approved == 'true'
        run: |
          python3 -B tools/execution_provenance/campaign.py \
            --protocol tools/execution_provenance/protocol.json \
            --output artifacts/godot-runtime/inert

      - name: Run frozen actual-Godot qualification
        if: inputs.mode == 'godot-runtime' && steps.review.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          authority_issue="$(python3 -c \
            'import json; print(json.load(open("artifacts/godot-runtime/ingress.json"))["authorityIssue"])')"
          python3 -B tools/execution_provenance/godot_runtime_campaign.py \
            --product-source "$RUNNER_TEMP/godot-product" \
            --packet-source "$RUNNER_TEMP/godot-packet" \
            --godot "$RUNNER_TEMP/godot/godot" \
            --output artifacts/godot-runtime/qualification \
            --observer-sha "$GITHUB_SHA" \
            --product-sha "$PRODUCT_SHA" \
            --packet-sha "$PACKET_SHA" \
            --packet-root "$PACKET_ROOT" \
            --authority-issue "$authority_issue" \
            --authority-comment "$AUTHORITY_COMMENT" \
            --request-index "$REQUEST_INDEX"

      - name: Execute one admitted A1 Godot invocation
        if: inputs.mode == 'godot-runtime-a1'
        shell: bash
        run: |
          set -euo pipefail
          authority_issue="$(python3 -c \
            'import json; print(json.load(open("artifacts/godot-runtime/ingress.json"))["authorityIssue"])')"
          python3 -B tools/execution_provenance/godot_runtime_campaign.py \
            --admit-only \
            --product-source "$RUNNER_TEMP/godot-product" \
            --packet-source "$RUNNER_TEMP/godot-packet" \
            --godot "$RUNNER_TEMP/godot/godot" \
            --output artifacts/godot-runtime/admission \
            --observer-sha "$GITHUB_SHA" \
            --product-sha "$PRODUCT_SHA" \
            --packet-sha "$PACKET_SHA" \
            --packet-root "$PACKET_ROOT" \
            --authority-issue "$authority_issue" \
            --authority-comment "$AUTHORITY_COMMENT" \
            --request-index "$REQUEST_INDEX" \
            --capability-prerequisite \
              "$RUNNER_TEMP/godot-runtime-capability-prerequisite.json" \
            --capability-run "$CAPABILITY_RUN" \
            --capability-receipt-sha256 "$CAPABILITY_RECEIPT_SHA256"

      - name: Upload Godot capability receipts and raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/godot-runtime
          if-no-files-found: error
          retention-days: 14

  cleanup-a1-packet-ref:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'godot-runtime-a1' }}
    needs: godot-runtime
    name: Delete terminal A1-v2 packet ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      PRODUCT_SHA: ${{ inputs.product_sha }}
      PACKET_SHA: ${{ inputs.packet_sha }}
      PACKET_REF: ${{ inputs.packet_ref }}
      PACKET_ROOT: ${{ inputs.packet_root }}
      AUTHORITY_COMMENT: ${{ inputs.authority_comment }}
      REQUEST_INDEX: ${{ inputs.request_index }}
    steps:
      - name: Check out exact trusted main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify published terminal receipt and delete exact packet ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          [[ "$PACKET_REF" =~ ^refs/heads/p9-packet-421-a1-v2-[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "$PACKET_REF" != *..* && "$PACKET_REF" != *. ]]
          artifact_name="godot-runtime-a1-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          published="$RUNNER_TEMP/published-a1"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$published"
          receipt="$published/admission/admission-receipt.json"
          case_receipt="$published/admission/cases/G00/receipt.json"
          python3 -B - "$receipt" "$case_receipt" "$PRODUCT_SHA" "$PACKET_SHA" "$PACKET_ROOT" \
            "$AUTHORITY_COMMENT" "$REQUEST_INDEX" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          record = json.loads(path.read_text(encoding="utf-8"))
          claimed = record.pop("receiptSha256", None)
          canonical = json.dumps(record, sort_keys=True, separators=(",", ":")).encode()
          case_path = pathlib.Path(sys.argv[2])
          case = json.loads(case_path.read_text(encoding="utf-8"))
          case_claimed = case.pop("receiptSha256", None)
          case_canonical = json.dumps(
              case, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          expected = {
              "schema": "glassvow.godot-runtime-provenance.admission-receipt/v1",
              "observerSha": sys.argv[3], "productSha": sys.argv[3],
              "packetSha": sys.argv[4], "packetRoot": sys.argv[5],
              "authorityIssue": 421, "authorityComment": int(sys.argv[6]),
              "requestIndex": sys.argv[7],
          }
          case_authority = case.get("authority")
          if any(record.get(key) != value for key, value in expected.items()):
              raise SystemExit("published A1 receipt binding differs")
          if (claimed != hashlib.sha256(canonical).hexdigest()
                  or record.get("verdict") not in {"PASS", "REJECT", "INCONCLUSIVE"}
                  or not isinstance(record.get("reason"), str)
                  or case.get("schema") != "glassvow.godot-runtime-provenance.receipt/v1"
                  or case.get("caseId") != "G00"
                  or case_claimed != hashlib.sha256(case_canonical).hexdigest()
                  or record.get("caseReceiptSha256") != case_claimed
                  or (case.get("verdict"), case.get("reason")) !=
                     (record.get("verdict"), record.get("reason"))
                  or not isinstance(case_authority, dict)
                  or any(case_authority.get(key) != value for key, value in {
                      "observerSha": sys.argv[3], "productSha": sys.argv[3],
                      "packetSha": sys.argv[4], "packetRoot": sys.argv[5],
                      "authorityIssue": 421, "authorityComment": int(sys.argv[6]),
                      "requestIndex": sys.argv[7]}.items())):
              raise SystemExit("published A1 receipt is not a terminal content-bound receipt")
          PY
          packet_ref_rows="$RUNNER_TEMP/a1-delete-ref.txt"
          git ls-remote --refs origin "$PACKET_REF" > "$packet_ref_rows"
          test "$(wc -l < "$packet_ref_rows")" -eq 1
          read -r remote_sha remote_ref < "$packet_ref_rows"
          test "$remote_sha" = "$PACKET_SHA"
          test "$remote_ref" = "$PACKET_REF"
          git push --force-with-lease="$PACKET_REF:$PACKET_SHA" origin ":$PACKET_REF"
          git ls-remote --refs origin "$PACKET_REF" > "$packet_ref_rows"
          test ! -s "$packet_ref_rows"
          mkdir -p artifacts/godot-runtime-a1-cleanup
          python3 -B - "$PACKET_REF" "$PACKET_SHA" "$receipt" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          receipt = pathlib.Path(sys.argv[3]).read_bytes()
          result = {
              "schema": "glassvow.godot-runtime-provenance.packet-cleanup/v1",
              "packetRef": sys.argv[1], "packetSha": sys.argv[2],
              "admissionReceiptSha256": hashlib.sha256(receipt).hexdigest(),
              "deleted": True,
          }
          body = json.dumps(result, sort_keys=True, separators=(",", ":")).encode()
          result["receiptSha256"] = hashlib.sha256(body).hexdigest()
          pathlib.Path("artifacts/godot-runtime-a1-cleanup/receipt.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8")
          PY

      - name: Upload A1-v2 packet cleanup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-runtime-a1-cleanup-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/godot-runtime-a1-cleanup
          if-no-files-found: error
          retention-days: 14
