name: Build-4 map defect corpus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/map-review-capture.yml'
      - 'tools/capture_build4_map_corpus.gd'
      - 'tools/capture_build4_map_corpus.sh'
      - 'tools/package_build4_map_corpus.py'
      - 'docs/reviews/462/**'

permissions:
  contents: read

jobs:
  capture:
    name: Reproduce 168-frame matrix twice
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact capture head
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python3 -m pip install --quiet 'Pillow>=10,<13'

      - name: Import assets
        run: tools/check_imports.sh

      - name: Capture and repeat the fixed build-4 matrix
        run: |
          tools/capture_build4_map_corpus.sh \
            --verify-repeat \
            --capture-head '${{ steps.head.outputs.sha }}' \
            --output artifacts/build4-map-corpus

      - name: Upload raw captures, compact packet, and repeatability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build4-map-defect-corpus-${{ steps.head.outputs.sha }}
          path: artifacts/build4-map-corpus
          if-no-files-found: error
          retention-days: 14
