name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/smolder-certificate-20260909/registered-identity
jobs:
  bundle:
    name: Preserve exact alias decision and capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            research/p9-six-route/smolder-certificate-20260909/registered-identity
            research/p9-six-route/package-disposition-20260908
      - name: Verify source and preserve every historical state field
        shell: bash
        run: |
          set -euo pipefail
          echo '004477378930029dc289a4fdc4e66e39d27467af85f80686abc093e998507a7f  research/p9-six-route/smolder-certificate-20260909/registered-identity/close_identity.py' | sha256sum -c -
          test ! -e "$STUDY/publication-1"
          mkdir "$STUDY/publication-1"
          cp research/p9-six-route/SESSION-STATE.json "$RUNNER_TEMP/state-before.json"
          python3 "$STUDY/close_identity.py" . > "$STUDY/publication-1/stdout.log" 2> "$STUDY/publication-1/stderr.log"
          python3 - <<'PY'
          import json,os,pathlib
          before=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'state-before.json').read_bytes())
          after=json.loads(pathlib.Path('research/p9-six-route/SESSION-STATE.json').read_bytes())
          changed=[k for k in before if before[k]!=after.get(k)]
          assert set(changed)<= {'status','exact_next_action','native_registered_identity'},changed
          assert after['p9_certified'] is False and after['packages_admitted']==0
          receipt={'source_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'changed_existing_fields':changed,'other_existing_fields_unchanged':True,'new_native_runs':0,'new_independent_samples':0,'p9_certified':False}
          (pathlib.Path(os.environ['STUDY'])/'publication-1/STATE-CHECK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit only current decision and capsule
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add "$STUDY/DECISION.json" "$STUDY/publication-1" research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/package-disposition-20260908/ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): close native role alias claims and stop redundant population work'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research/p9-six-route/smolder-certificate-20260909/registered-identity
            research/p9-six-route/package-disposition-20260908
      - name: Verify complete published decision bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);paths=[root/'close_identity.py',root/'DECISION.json']
          paths+=list((root/'publication-1').iterdir())
          paths+=[pathlib.Path('research/p9-six-route')/p for p in ('SESSION-STATE.json','SESSION-HANDOFF.md','package-disposition-20260908/ROADMAP.md')]
          entries=[]
          for p in sorted(paths):
              b=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==b,str(p)
              entries.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          receipt={'kind':'CURRENT_ALIAS_DECISION_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':entries,'upstream_proof':'execution-1/REMOTE-READBACK.json','new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (root/'publication-1/REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CURRENT_CAPSULE_READBACK_FILES='+str(len(entries)))
          PY
          git add "$STUDY/publication-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain verified current capsule readback'
          test "$(git ls-remote origin refs/heads/research/p9-six-route-local-20260905 | cut -f1)" = "$PUBLISHED_HEAD"
          git push origin HEAD:refs/heads/research/p9-six-route-local-20260905
