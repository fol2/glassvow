name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1/one-sample-v1
jobs:
  bundle:
    name: One public determinization - unchanged value, support and resource bars
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route
      - name: Bind one nomination and unchanged comparison machinery before observations
        id: binding
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          hashes={'study.py':'7079b6f62d9b3734a57e3e1e4fb37640c0838073d3fc0d208a3b528607210ba9','test_study.py':'b9480158de86691a8aee54607b39066fbbab6e3965d7c5e30d39e128923c4883'}
          for name,digest in hashes.items():
              p=root/name;b=p.read_bytes()
              assert hashlib.sha256(b).hexdigest()==digest,name
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==subprocess.check_output(['git','rev-parse','HEAD:'+str(p)]).decode().strip()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_study) > "$RUNNER_TEMP/one-sample-tests.log" 2>&1
          python3 "$STUDY/study.py" build "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/one-sample-build.stdout" 2> "$RUNNER_TEMP/one-sample-build.stderr"
          (cd "$STUDY/bound-source" && python3 -m unittest -v test_value) >> "$RUNNER_TEMP/one-sample-tests.log" 2>&1
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/bound-source"
          git commit -m 'research(p9): freeze exact one-sample source and unused evaluation assignment'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify the new decision procedure and execute only its frozen conditional stages
        id: native
        if: steps.binding.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
          } > "$RUNNER_TEMP/one-sample-engine.log" 2>&1
          python3 "$STUDY/study.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/one-sample" --publish > "$RUNNER_TEMP/one-sample-run.stdout" 2> "$RUNNER_TEMP/one-sample-run.stderr"
      - name: Preserve all available source, actual terminal and complete diagnostics
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'execution-1';out.mkdir(exist_ok=True)
          for path in pathlib.Path(os.environ['RUNNER_TEMP']).glob('one-sample-*'):
              if path.is_file():shutil.copyfile(path,out/path.name)
          terminal=out/'TERMINAL.json'
          if not terminal.exists():terminal.write_text(json.dumps({'status':'INCONCLUSIVE','failure':'SOURCE_BINDING_OR_ENGINE_ENTRY_FAILED','source_head':os.environ['GITHUB_SHA'],'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          records=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'FILES.json']
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          files=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file() and p!=root/'PUBLISHED-FILES.json']
          (root/'PUBLISHED-FILES.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STUDY"
          git diff --cached --name-only | awk -v prefix="$STUDY/" 'index($0,prefix)!=1 {exit 1}'
          git commit -m 'research(p9): preserve exact one-sample capture and complete delivery diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Cold-read all committed bytes and reproduce every opened decision
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold');manifest=(root/'PUBLISHED-FILES.json').read_bytes()
          assert manifest==(cold/root/'PUBLISHED-FILES.json').read_bytes()
          files=json.loads(manifest)
          for r in files:
              p=pathlib.Path(r['path']);assert not p.is_absolute() and '..' not in p.parts
              a=(root/p).read_bytes();b=(cold/root/p).read_bytes()
              assert a==b and len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256'],str(p)
          out=root/'execution-1';receipt=out/'REMOTE-READBACK.json'
          if (cold/root/'bound-source/FREEZE.json').exists():
              subprocess.run(['python3',str(cold/root/'study.py'),'verify',str(cold.resolve()),str(out.resolve()),str((cold/out).resolve()),str(receipt.resolve())],check=True)
          else:
              receipt.write_text(json.dumps({'kind':'SOURCE_ENTRY_DIAGNOSTICS_COLD_READBACK','files':len(files)+1,'all_bytes_equal':True,'qualification_reproduced':False,'population_reproduced':False,'scientific_status':'INCONCLUSIVE','packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          p=out/'SOURCE-READBACK.json';p.write_text(json.dumps({'source_head':os.environ['GITHUB_SHA'],'published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':len(files)+1,'all_source_and_capture_bytes_equal':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-1/"*READBACK.json
          git commit -m 'research(p9): retain independent checkout byte proof of one-sample study'
          git push origin HEAD:refs/heads/$branch
      - name: Report delivery validity separately from package admission
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(os.environ['STUDY'])/'execution-1/TERMINAL.json'
          t=json.loads(p.read_bytes());print(json.dumps(t,indent=2))
          sys.exit(3 if t['status']=='INCONCLUSIVE' else 0)
          PY
