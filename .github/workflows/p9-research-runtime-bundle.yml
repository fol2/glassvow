name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

jobs:
  bundle:
    name: Publish exact-source six-package disposition - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route
      - name: Read only exact historical hand contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c802be36510273481b6d0f865b92fac43abf6aff
          path: historical
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research/issue-421/protocols/post-v38-hand-size-inventory-v1.json
            research/issue-421/protocols/post-v38-hand-size-inventory-v2.json
          sparse-checkout-cone-mode: false
      - name: Reproduce only the missing disposition and hand-scope evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 research/p9-six-route/package-disposition-20260908/publish_disposition.py
      - name: Publish only the five derived files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          root=research/p9-six-route/package-disposition-20260908
          git add "$root/HAND-READOUT.json" "$root/DISPOSITION.json" "$root/ROADMAP.md" "$root/DISPOSITION-TESTS.log" "$root/DISPOSITION-EXECUTION.json"
          python3 - <<'PY'
          import subprocess
          root='research/p9-six-route/package-disposition-20260908/'
          expected={root+n for n in ['HAND-READOUT.json','DISPOSITION.json','ROADMAP.md','DISPOSITION-TESTS.log','DISPOSITION-EXECUTION.json']}
          if set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())!=expected:raise RuntimeError('STAGED_SCOPE')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): publish verified six-package disposition and corrected hand-family scope'
          git push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch the published bytes separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.publish.outputs.head }}
          path: readback
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/package-disposition-20260908
      - name: Verify every published input and output byte
        shell: bash
        run: |
          set -euo pipefail
          python3 research/p9-six-route/package-disposition-20260908/publish_disposition.py --readback readback
