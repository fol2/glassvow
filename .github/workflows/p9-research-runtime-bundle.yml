name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1/value-v1
jobs:
  bundle:
    name: Delivery-only dispatch correction and original planner value study
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            .github
            domain
            content
            tools
            research/p9-six-route/ash-inheritance-20260909
            research/p9-six-route/v8
            research/p9-six-route/v9
            research/p9-six-route/v13
            research/p9-six-route/v15
            research/p9-six-route/v17
            research/p9-six-route/v18
            research/p9-six-route/v19
      - name: Load the same approved engine and prove the specific pre-population repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$STUDY/delivery-2"
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
            echo "ENGINE=$engine" >> "$GITHUB_ENV"
          } > "$STUDY/delivery-2/engine.log" 2>&1
          echo "ab2c32022c9dec65228d25b3304ef4fb5aeb3976430e53e18b813f7e8f97ffb0  $STUDY/repair_dispatch.py" | sha256sum -c -
          python3 "$STUDY/repair_dispatch.py" "$GITHUB_WORKSPACE" "$engine"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STUDY/repair-1" "$STUDY/repaired-source-1"
          git commit -m 'research(p9): bind exact setter repair without changing controller decisions or cohort'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify boundaries and execute only original frozen conditional stages
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/repaired-source-1/experiment.py" run "$GITHUB_WORKSPACE" "$ENGINE" "$STUDY/execution-2" "$RUNNER_TEMP/planner-value" --publish > "$STUDY/delivery-2/runner.stdout" 2> "$STUDY/delivery-2/runner.stderr"
      - name: Preserve every available diagnostic and actual terminal
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          (root/'delivery-2/EXECUTION.json').write_text(json.dumps({'source_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'native':os.environ['NATIVE_OUTCOME'],'p9_certified':False},indent=2)+'\n')
          (root/'execution-2').mkdir(exist_ok=True)
          if not (root/'execution-2/TERMINAL.json').exists():
              (root/'execution-2/TERMINAL.json').write_text(json.dumps({'status':'INCONCLUSIVE','reason':'No runner terminal','stages':{},'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add -f "$STUDY"
          git diff --cached --quiet || git commit -m 'research(p9): preserve complete planner value delivery diagnostics after syntax repair'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github
            research/p9-six-route/ash-inheritance-20260909
      - name: Cold-read complete source and capture, replay only readers
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);paths=[p for p in sorted(root.rglob('*')) if p.is_file()]
          paths.append(pathlib.Path('.github/workflows/p9-research-runtime-bundle.yml'))
          rows=[]
          for p in paths:
              b=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==b,str(p)
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert blob==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(p)]).decode().strip(),str(p)
              rows.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          (root/'delivery-2/SOURCE-READBACK.json').write_text(json.dumps({'published_head':os.environ['PUBLISHED_HEAD'],'files':rows,'all_bytes_equal':True,'p9_certified':False},indent=2)+'\n')
          PY
          if test -f "$STUDY/execution-2/FILES.json"; then
            python3 "cold/$STUDY/repaired-source-1/experiment.py" verify cold "$STUDY/execution-2" "cold/$STUDY/execution-2" "$STUDY/execution-2/REMOTE-READBACK.json"
          fi
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add -f "$STUDY/delivery-2/SOURCE-READBACK.json" "$STUDY/execution-2"
          git commit -m 'research(p9): retain cold byte proof of repaired planner value capture'
          git push origin HEAD:refs/heads/$branch
      - name: Report actual scientific status without claiming a package PASS
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])/'execution-2'
          terminal=json.loads((root/'TERMINAL.json').read_bytes());print(json.dumps(terminal,indent=2))
          if terminal['status']=='INCONCLUSIVE':
              for p in sorted((root/'qualification').glob('*.stdout')):
                  text=p.read_text()
                  if text:print(p.name,text)
              for p in sorted((root/'qualification').glob('*.stderr')):
                  text=p.read_text()
                  if text:print(p.name,text)
          assert terminal['status'] in ('FIXED_PLANNER_VALUE_OR_SUPPORT_NOT_ESTABLISHED','PLANNER_VALUE_AND_INHERITED_PAIR_SUPPORT_PASS_NOT_CERTIFICATE')
          PY
