name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1
jobs:
  bundle:
    name: Diagnose preserved query mismatch - no engine or new observations
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1
      - name: Check source identity and diagnose complete immutable capture
        id: diagnosis
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['STUDY'])/'diagnose.py';b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='25940d4d52d1be5f27aff3bd0e562605b07bfa97'
          compile(b,str(p),'exec')
          PY
          python3 "$STUDY/diagnose.py" "$STUDY/execution-1" "$STUDY/query-diagnosis-1" > "$RUNNER_TEMP/hand-query.log" 2>&1
      - name: Preserve diagnosis or actual failure without changing native terminal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STUDY/query-diagnosis-1"
          cp "$RUNNER_TEMP/hand-query.log" "$STUDY/query-diagnosis-1/run.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['STUDY'])/'query-diagnosis-1'
          (p/'DELIVERY.json').write_text(json.dumps({'status':'DIAGNOSIS_COMPLETE' if '${{ steps.diagnosis.outcome }}'=='success' else 'DIAGNOSIS_INCOMPLETE','new_native_runs':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          records=[{'path':f.name,'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(p.iterdir()) if f.is_file() and f.name!='FILES.json']
          (p/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add "$STUDY/query-diagnosis-1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve complete Hand query mismatch diagnosis'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.diagnosis.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1
      - name: Reproduce diagnostic from separately fetched raw and compare every output byte
        if: steps.diagnosis.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path(os.environ['STUDY']);out=root/'query-diagnosis-1';cold=pathlib.Path('cold')/root
          assert (out/'FILES.json').read_bytes()==(cold/'query-diagnosis-1/FILES.json').read_bytes()
          records=json.loads((out/'FILES.json').read_bytes())
          for r in records:
              b=(cold/'query-diagnosis-1'/r['path']).read_bytes()
              assert b==(out/r['path']).read_bytes() and len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)/'new'
              subprocess.run([sys.executable,str(cold/'diagnose.py'),str(cold/'execution-1'),str(p)],check=True)
              for name in ('RESULTS.json','SOURCES.json','MISMATCHES.json'):
                  assert (p/name).read_bytes()==(out/name).read_bytes()
          (out/'REMOTE-READBACK.json').write_text(json.dumps({'kind':'HAND_QUERY_DIAGNOSIS_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'files':records,'all_bytes_equal':True,'diagnosis_reproduced':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/query-diagnosis-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record cold-reproduced Hand query diagnosis'
          git push origin HEAD:refs/heads/$branch
      - name: Do not mark incomplete diagnosis as complete
        if: always() && steps.diagnosis.outcome != 'success'
        run: exit 3
