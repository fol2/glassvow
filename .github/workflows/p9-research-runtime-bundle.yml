name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1/query-repair-1
jobs:
  bundle:
    name: Corrected source-bound query and missing OFF coverage
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1
      - name: Verify explicit correction and run its exact tests
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);p=json.loads((root/'PROTOCOL.json').read_bytes())
          for name,want in p['source_git_blobs'].items():
              b=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==want,name
              compile(b,str(root/name),'exec')
          assert not (root/'execution-1').exists()
          assert p['new_population_outcomes']==0 and p['packages_admitted']==0 and not p['p9_certified']
          PY
          (cd "$STUDY" && python3 -m unittest -v test_repair) > "$RUNNER_TEMP/hand-repair-tests.log" 2>&1
      - name: Restore exact previously captured runtime and observe only missing OFF cases
        id: native
        if: steps.source.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
          } > "$RUNNER_TEMP/hand-repair-engine.log" 2>&1
          python3 "$STUDY/repair.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/hand-query-off" > "$RUNNER_TEMP/hand-repair-run.stdout" 2> "$RUNNER_TEMP/hand-repair-run.stderr"
      - name: Preserve complete results or actual delivery diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'execution-1';out.mkdir(exist_ok=True)
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('hand-repair-*'):
              if p.is_file():shutil.copyfile(p,out/p.name)
          if not (out/'TERMINAL.json').exists():
              (out/'TERMINAL.json').write_text(json.dumps({'status':'INCONCLUSIVE','failure':'DELIVERY_BEFORE_NATIVE_TERMINAL','new_population_outcomes':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          records=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file() and p.name!='FILES.json']
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/execution-1"
          git commit -m 'research(p9): preserve query-correction delivery and all actual diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/native-v1
      - name: Read all committed bytes and reconstruct the decision without an engine
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          cmp "$STUDY/repair.py" "cold/$STUDY/repair.py"
          cmp "$STUDY/test_repair.py" "cold/$STUDY/test_repair.py"
          cmp "$STUDY/PROTOCOL.json" "cold/$STUDY/PROTOCOL.json"
          python3 "cold/$STUDY/repair.py" verify "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$GITHUB_WORKSPACE/cold/$STUDY/execution-1" "$GITHUB_WORKSPACE/$STUDY/execution-1/REMOTE-READBACK.json"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/execution-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record exact remote readback of coherent Hand query correction'
          git push origin HEAD:refs/heads/$branch
      - name: Keep incomplete qualification fail closed
        if: always() && steps.native.outcome != 'success'
        run: exit 3
