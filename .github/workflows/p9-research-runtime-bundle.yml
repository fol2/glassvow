name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/joint-controller-v1
  NEXT_ACTION: Use the complete factual charge ledger and matched quality/membership readout to bind a package-level causal/value contract for inherited Hand/Bloodfire, separating the source card draw/HP trade-off from incremental mediator payoff. Do not nominate a third acquisition/planner combination, tune weights, or reuse exposed seeds. Name the complete missing producer/subset/descriptor and independent-confirmation obligations against unchanged P9 acceptance before any new native observation. The failed joint controller is not promoted.
jobs:
  bundle:
    name: Close the complete joint decision and cold-check the current capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route
      - name: Reconstruct frozen gates and synchronize only verified complete evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          assert os.environ['NEXT_ACTION']!='__SET_FROM_COMPLETE_TERMINAL__'
          for name in ('close_joint.py','test_close_joint.py'):
              p=root/name;b=p.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual==subprocess.check_output(['git','rev-parse','HEAD:'+str(p)]).decode().strip()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_close_joint) > "$RUNNER_TEMP/joint-closure-tests.log" 2>&1
          python3 "$STUDY/close_joint.py" "$GITHUB_WORKSPACE" "$NEXT_ACTION"
          cp "$RUNNER_TEMP/joint-closure-tests.log" "$STUDY/closure-1/TESTS.log"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add "$STUDY/closure-1" research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/SESSION-STATE.json research/p9-six-route/package-disposition-20260908/ROADMAP.md
          python3 - <<'PY'
          import os,subprocess
          root=os.environ['STUDY']+'/closure-1/'
          expected={root+'DECISION.json',root+'TRACE-RESOURCE-LEDGER.json',root+'TESTS.log','research/p9-six-route/SESSION-HANDOFF.md','research/p9-six-route/SESSION-STATE.json','research/p9-six-route/package-disposition-20260908/ROADMAP.md'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert actual==expected,actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): close joint trial with exact frozen decisions and current capsule'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Read back all new source and capsule bytes and reconstruct the terminal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')
          files=[root/'close_joint.py',root/'test_close_joint.py',*sorted((root/'closure-1').glob('*')),pathlib.Path('research/p9-six-route/SESSION-HANDOFF.md'),pathlib.Path('research/p9-six-route/SESSION-STATE.json'),pathlib.Path('research/p9-six-route/package-disposition-20260908/ROADMAP.md')]
          rows=[]
          for p in files:
              b=p.read_bytes();assert (cold/p).read_bytes()==b,str(p)
              rows.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          spec=importlib.util.spec_from_file_location('cold_closure',cold/root/'close_joint.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          load=lambda p:json.loads((cold/p).read_bytes())
          actual=m.summarize(load(root/'execution-1/TERMINAL.json'),load(root/'execution-1/REMOTE-READBACK.json'),load(root/'PROTOCOL.json'))
          decision=load(root/'closure-1/DECISION.json')
          assert all(decision[k]==v for k,v in actual.items())
          for vow in actual['stages']:
              folder=root/'execution-1'/f'v{vow}'
              description=m.describe_complete_pairs({name:load(folder/(name+'-support.json')) for name in ('stock','aware')})
              assert description==decision['descriptive_readout'][vow]
          ledger,_=m.describe_all_traces(cold.resolve(), (cold/root/'execution-1').resolve(),load(root/'execution-1/TERMINAL.json'))
          assert ledger==load(root/'closure-1/TRACE-RESOURCE-LEDGER.json')
          for row in decision['source_inputs']:
              b=(cold/row['path']).read_bytes();assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256'] and m.blob(b)==row['git_blob']
          state=load(pathlib.Path('research/p9-six-route/SESSION-STATE.json'))
          assert state['joint_controller_frontier']=={k:v for k,v in decision.items() if k!='source_inputs'}
          receipt={'kind':'COMPLETE_JOINT_FRONTIER_COLD_READBACK','source_head':os.environ['GITHUB_SHA'],'published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':rows,'all_bytes_equal':True,'decision_reproduced':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (root/'closure-1/REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='files'},indent=2))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain cold byte proof of the synchronized joint frontier'
          git push origin HEAD:refs/heads/$branch
