name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/control-v1
jobs:
  bundle:
    name: Finish serialized control readback and capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/
            /research/p9-six-route/guardrail-confirmation-20260909/
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: input-cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/
            /research/p9-six-route/guardrail-confirmation-20260909/
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Check source, test exact serialization and rebuild only the original readout
        id: finish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          expected={'finish_control.py':'26b2bd77bd427390413ed8ea7cab03c2c6e23db7','test_finish_control.py':'b147b3da4b5f3d785797bf54651fe37079168622'}
          for n,h in expected.items():
              b=(root/n).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
              assert b==(pathlib.Path('input-cold')/root/n).read_bytes();compile(b,n,'exec')
          assert not (root/'closure-1').exists()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_finish_control) > "$RUNNER_TEMP/control-finish-tests.log" 2>&1
          python3 "$STUDY/finish_control.py" run "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/input-cold" "$GITHUB_WORKSPACE/$STUDY/closure-1" > "$RUNNER_TEMP/control-finish-run.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          out=pathlib.Path(os.environ['STUDY'])/'closure-1';records=json.loads((out/'FILES.json').read_bytes())
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('control-finish-*.log'):
              q=out/p.name;shutil.copyfile(p,q);b=q.read_bytes()
              records.append({'path':str(q),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Publish complete closure or actual failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.finish.outcome }}' = success ]; then
            git add "$STUDY/closure-1" research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/SESSION-STATE.json research/p9-six-route/package-disposition-20260908/ROADMAP.md
          else
            mkdir -p "$STUDY/closure-delivery-1"
            cp "$RUNNER_TEMP"/control-finish-*.log "$STUDY/closure-delivery-1/" 2>/dev/null || true
            printf '%s\n' '{"status":"CONTROL_CLOSURE_INCOMPLETE","new_native_runs":0,"packages_admitted":0,"p9_certified":false}' > "$STUDY/closure-delivery-1/TERMINAL.json"
            git add "$STUDY/closure-delivery-1"
          fi
          python3 - <<'PY'
          import os,subprocess
          root=os.environ['STUDY'];shared={'research/p9-six-route/'+n for n in ('SESSION-HANDOFF.md','SESSION-STATE.json','package-disposition-20260908/ROADMAP.md')}
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert paths and all(p in shared or p.startswith(root+'/closure-1/') or p.startswith(root+'/closure-delivery-1/') for p in paths)
          PY
          git commit -m 'research(p9): preserve exact control-readback decision and current two-slope Hand capsule'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.finish.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: output-cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Compare every new closure and capsule byte after its commit
        if: steps.finish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 "output-cold/$STUDY/finish_control.py" verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/output-cold" "$GITHUB_WORKSPACE/$STUDY/closure-1/REMOTE-READBACK.json"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record cold-readback of complete isolated-Hand control closure'
          git push origin HEAD:refs/heads/$branch
      - name: Do not conceal incomplete delivery
        if: always() && steps.finish.outcome != 'success'
        run: exit 3
