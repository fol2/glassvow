name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

jobs:
  bundle:
    name: Locate immutable package laws - no engine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact historical archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c802be36510273481b6d0f865b92fac43abf6aff
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout: research/issue-421
      - name: Print exact law paths and scope references
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c802be36510273481b6d0f865b92fac43abf6aff
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('research/issue-421')
          names=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','research/issue-421']).decode().splitlines()
          pattern=re.compile(r'honing|cadence|resonance|shatter.to|shatterer|strength|fervor|flurry|hand.size|phantom|smolder',re.I)
          hits=[n for n in names if pattern.search(n)]
          print('PATH_INVENTORY='+json.dumps({'archive_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'tracked_files':len(names),'matching_paths':hits},sort_keys=True))
          summaries=[]
          for name in hits:
              p=pathlib.Path(name)
              if '/summaries/' not in name or not name.endswith('.md'):continue
              b=p.read_bytes()
              summaries.append({'path':name,'bytes':len(b),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(),'text':b.decode()})
          print('EXACT_SUMMARIES='+json.dumps(summaries,sort_keys=True))
          print('NO_NATIVE_RUNS=0; NO_NEW_SAMPLES=0; NO_P9_ADMISSION')
          PY
