name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
jobs:
  bundle:
    name: Inspect existing recovery prefix only - no engine or qualification
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research/p9-six-route/ash-inheritance-20260909/causal-transport-v1
      - name: Verify existing parts and locate recoverable complete nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 research/p9-six-route/ash-inheritance-20260909/causal-transport-v1/inspect_prefix.py
