name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-value-v1/source-path-census-1
jobs:
  bundle:
    name: Close verified Hand diagnosis and current capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route
      - name: Verify inputs and update only current decisions
        id: close
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          for n,h in {'close_census.py':'21232c6d919207fab0c7d880735aa4abb865af4a','test_close_census.py':'ce91342cb4816a8c19e9396bb3685ddd16f7deca'}.items():
              b=(root/n).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          assert not (root/'closure-1').exists()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_close_census) > "$RUNNER_TEMP/census-close-tests.log" 2>&1
          python3 "$STUDY/close_census.py" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/census-close-run.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'closure-1';records=json.loads((out/'FILES.json').read_bytes())
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('census-close-*.log'):
              q=out/p.name;shutil.copyfile(p,q);b=q.read_bytes()
              records.append({'path':str(q),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Commit closure or preserve exact failure logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.close.outcome }}' = success ]; then
            git add "$STUDY/closure-1" research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/SESSION-STATE.json research/p9-six-route/package-disposition-20260908/ROADMAP.md
          else
            mkdir "$STUDY/closure-delivery-1"
            cp "$RUNNER_TEMP"/census-close-*.log "$STUDY/closure-delivery-1/" 2>/dev/null || true
            printf '%s\n' '{"status":"CLOSURE_DELIVERY_INCOMPLETE","new_native_runs":0,"p9_certified":false}' > "$STUDY/closure-delivery-1/TERMINAL.json"
            git add "$STUDY/closure-delivery-1"
          fi
          python3 - <<'PY'
          import os,subprocess
          root=os.environ['STUDY'];names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          shared={'research/p9-six-route/'+n for n in ('SESSION-HANDOFF.md','SESSION-STATE.json','package-disposition-20260908/ROADMAP.md')}
          assert names and all(n in shared or n.startswith(root+'/closure-1/') or n.startswith(root+'/closure-delivery-1/') for n in names)
          PY
          git commit -m 'research(p9): close measured Hand bottleneck and preserve bounded design frontier'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.close.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Read back final current state and recompute the diagnosis
        if: steps.close.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);out=root/'closure-1';cold=pathlib.Path('cold')
          raw=(out/'FILES.json').read_bytes();assert raw==(cold/out/'FILES.json').read_bytes();records=json.loads(raw)
          for r in records:
              p=pathlib.Path(r['path']);assert not p.is_absolute() and '..' not in p.parts
              b=(cold/p).read_bytes();assert b==p.read_bytes() and len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
              h=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert h==r['git_blob']==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(p)]).decode().strip()
          spec=importlib.util.spec_from_file_location('cold_diagnosis',cold/root/'close_census.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          expected=json.loads((cold/out/'DECISION.json').read_bytes());actual=m.decision(json.loads((cold/root/'execution-1/RESULTS.json').read_bytes()))
          assert all(expected[k]==v for k,v in actual.items())
          state=json.loads((cold/'research/p9-six-route/SESSION-STATE.json').read_bytes())
          assert state['exact_next_action']==actual['next_action'] and state['packages_admitted']==0 and state['p9_certified'] is False
          receipt={'kind':'HAND_FULL_SOURCE_DIAGNOSIS_AND_CAPSULE_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'files':records,'all_bytes_equal':True,'decision_reproduced':True,'current_capsule_consistent':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (out/'REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record verified final Hand diagnosis and current capsule readback'
          git push origin HEAD:refs/heads/$branch
      - name: Reject an incomplete closure
        if: always() && steps.close.outcome != 'success'
        run: exit 3
