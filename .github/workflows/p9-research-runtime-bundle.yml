name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1
jobs:
  bundle:
    name: Correct observed parse-root defect and continue unchanged compatibility matrix
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route/ash-inheritance-20260909
            research/p9-six-route/v8
            research/p9-six-route/v9
            research/p9-six-route/v13
            research/p9-six-route/v15
            research/p9-six-route/v17
            research/p9-six-route/v18
            research/p9-six-route/v19
      - name: Require exact retained failure, red-green path proof, unchanged cases
        shell: bash
        run: |
          set -euo pipefail
          echo "0e92d13957dd7a906c087a59b29e02cbde643e31581ad8cc4e51546a2ffb0672  $STUDY/repair_delivery.py" | sha256sum -c -
          python3 "$STUDY/repair_delivery.py" repair "$GITHUB_WORKSPACE"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/repair-1" "$STUDY/repaired-source-1"
          git commit -m 'research(p9): bind parse-root delivery repair with unchanged planner and criteria'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Load the same pinned official engine
        id: engine
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$STUDY/execution-2"
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
            echo "ENGINE=$engine" >> "$GITHUB_ENV"
          } > "$STUDY/execution-2/engine.log" 2>&1
      - name: Execute the original fixed compatibility cases, no population
        id: native
        if: steps.engine.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/repaired-source-1/run.py" "$GITHUB_WORKSPACE" "$ENGINE" "$RUNNER_TEMP/planner-capture" > "$STUDY/execution-2/runner.stdout" 2> "$STUDY/execution-2/runner.stderr"
      - name: Preserve every available native byte and complete diagnostics
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/repair_delivery.py" pack "$GITHUB_WORKSPACE" "$RUNNER_TEMP/planner-capture"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add -f "$STUDY/execution-2"
          git commit -m 'research(p9): retain planner qualification capture after delivery-only repair'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/planner-v1
      - name: Cold-read complete repaired source and capture, reconstruct without an engine
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/repair_delivery.py" verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cold"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-2/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain exact cold readback of unchanged planner compatibility decision'
          git push origin HEAD:refs/heads/$branch
      - name: Report the actual scientific terminal
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])/'execution-2'
          print((root/'TERMINAL.json').read_text())
          if (root/'RESULTS.json').exists():print((root/'RESULTS.json').read_text())
          for p in sorted(root.glob('*.stderr')):
              text=p.read_text()
              if text:print(p.name,text)
          assert json.loads((root/'TERMINAL.json').read_bytes())['status']=='PLANNER_CURRENT_RUNTIME_COMPATIBILITY_PASS'
          PY
