name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

jobs:
  bundle:
    name: Close fixed Hand support and its signed-control prerequisite
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact continuation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route
      - name: Verify former sole writer has stopped
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/fol2/glassvow/actions/runs/34283063800 --jq '{id,status,conclusion,head_sha}' > "$RUNNER_TEMP/previous-run.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'previous-run.json').read_bytes())
          assert p['status']=='completed','Never race the existing research writer'
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Test terminal, recovery and control contracts without a game
        shell: bash
        run: |
          set -euo pipefail
          study=research/p9-six-route/hand-admission-20260908/support-v1
          PYTHONPATH="$GITHUB_WORKSPACE/$study" python3 -m unittest discover -v -s "$study/postrun" > "$RUNNER_TEMP/postrun-tests.log" 2>&1
          (cd research/p9-six-route/guardrail-confirmation-20260909 && python3 -m unittest -v test_control) > "$RUNNER_TEMP/control-tests.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('research/p9-six-route/guardrail-confirmation-20260909')
          assert hashlib.sha256((r/'PROTOCOL.json').read_bytes()).hexdigest()=='f8eaf9dffc65fa30222c80083ca0397a80174837cf8be1134c39613bf1c860c7'
          p=json.loads((r/'PROTOCOL.json').read_bytes())
          for name,h in p['source_sha256'].items():assert hashlib.sha256((r/name).read_bytes()).hexdigest()==h,name
          PY
      - name: Bind the existing official engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p9-engine"
          curl --fail --location --max-time 120 --output "$RUNNER_TEMP/p9-engine/engine.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/p9-engine/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p9-engine/engine.zip" -d "$RUNNER_TEMP/p9-engine"
          chmod +x "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64" | sha256sum -c -
      - name: Reuse completed support or resume only missing configurations
        shell: bash
        run: |
          set -euo pipefail
          study=research/p9-six-route/hand-admission-20260908/support-v1
          python3 -u "$study/postrun/resume_support.py" . "$study" "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64" --push
      - name: Verify full preserved support and publish current capsule
        shell: bash
        run: |
          set -euo pipefail
          study=research/p9-six-route/hand-admission-20260908/support-v1
          python3 "$study/postrun/audit_terminal.py" "$study" > "$study/postrun/RESULTS.json"
          cp "$RUNNER_TEMP/postrun-tests.log" "$study/postrun/TESTS.log"
          cp "$RUNNER_TEMP/previous-run.json" "$study/postrun/PRIOR-VENUE.json"
          python3 "$study/postrun/close_capsule.py" . "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import pathlib,sys
          root=pathlib.Path('research/p9-six-route').resolve()
          study=root/'hand-admission-20260908/support-v1'
          sys.path.insert(0,str(study))
          import run_support as r
          receipt=r.publication(root,'research(p9): preserve complete Hand support audit and actual next boundary',True)
          r.save(study/'postrun/REMOTE-READBACK.json',receipt)
          PY
      - name: Execute the frozen signed-control screen only after Hand support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path('research/p9-six-route').resolve()
          support=root/'hand-admission-20260908/support-v1'
          guard=root/'guardrail-confirmation-20260909'
          status=json.loads((support/'capture-1/TERMINAL.json').read_bytes())['status']
          if status!='HAND_NATURAL_SUPPORT_GATE_PASS_NOT_PACKAGE_ADMISSION':
              (guard/'NOT-EXECUTED.json').write_text(json.dumps({'reason':'Hand necessary-support prerequisite did not pass','hand_status':status,'new_control_rows':0,'p9_certified':False},indent=2)+'\n')
          else:
              output=guard/'native-1'
              if not (output/'TERMINAL.json').exists():
                  rc=subprocess.run([sys.executable,str(guard/'execute_control.py'),'.',os.environ['RUNNER_TEMP']+'/p9-engine/Godot_v4.7.2-stable_linux.x86_64',str(output)]).returncode
                  if rc!=0:raise SystemExit('Signed-control capture is inconclusive; keep and diagnose before retry')
              sys.path.insert(0,str(guard));import read_control as c
              result=c.analyze(output,json.loads((guard/'PROTOCOL.json').read_bytes()))
              assert (json.dumps(result,indent=2)+'\n').encode()==(output/'RESULTS.json').read_bytes(),'Cold decoder changed result bytes'
          PY
      - name: Preserve all available control bytes and the exact decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,sys
          root=pathlib.Path('research/p9-six-route').resolve()
          study=root/'hand-admission-20260908/support-v1'
          guard=root/'guardrail-confirmation-20260909'
          sys.path.insert(0,str(study));import run_support as r
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'control-tests.log'
          if src.exists():shutil.copyfile(src,guard/'TESTS.log')
          terminal=guard/'native-1/TERMINAL.json'
          if terminal.exists():
              result=json.loads(terminal.read_bytes())
              state_path=root/'SESSION-STATE.json';state=json.loads(state_path.read_bytes())
              state['signed_control_screen']={'status':result['status'],'protocol':'guardrail-confirmation-20260909/PROTOCOL.json','terminal':'guardrail-confirmation-20260909/native-1/TERMINAL.json','source_freeze':os.environ['GITHUB_SHA'],'packages_admitted':0,'p9_certified':False}
              if result['status']=='SIGNED_CONTROL_NECESSARY_SCREEN_FAIL':
                  state['status']='P9_UNFINISHED_EXACT_CANDIDATE_SIGNED_CONTROL_SCREEN_FAIL'
                  state['exact_next_action']='Preserve the valid Hand support but do not invest in larger certification of this exact candidate while its signed-control screen fails. Identify an already-authorised, materially different candidate or the genuine product boundary; no weaker controls, same-screen extension, protected data or automatic label rescue.'
              elif result['status']=='SIGNED_CONTROL_NECESSARY_SCREEN_PASS_NOT_P9':
                  state['status']='P9_UNFINISHED_HAND_SUPPORT_AND_SIGNED_CONTROL_SCREEN_PASSED'
                  state['exact_next_action']='Freeze the still-missing independent complete Hand complementarity, peer/policy and duration/ceiling confirmation. Reuse this necessary control screen with correct identity/scope; do not repeat support, old panels or another roadmap.'
              else:
                  state['status']='P9_UNFINISHED_SIGNED_CONTROL_CAPTURE_INCONCLUSIVE'
                  state['exact_next_action']='Read the exact signed-control capture failure and preserve all available bytes. Repair only the demonstrated delivery fault under the same fixed scientific assignment; no unsupported support/package/P9 pass.'
              state['no_active_research_processes']=True
              r.save(state_path,state)
              handoff=root/'SESSION-HANDOFF.md';text=handoff.read_text();marker='\n## Latest signed-control decision\n'
              text=text.split(marker)[0]+marker+'\n'+result['status']+'\n\n'+state['exact_next_action']+'\n\nThis screen is not C2, a package certificate, a detector or P9. Its raw and controls are retained unchanged.\n'
              handoff.write_text(text)
          receipt=r.publication(root,'research(p9): preserve signed controls and scoped next decision without P9 promotion',True)
          r.save(guard/'REMOTE-READBACK.json',receipt)
          final=r.publication(root,'research(p9): persist final remote byte-readback receipt',True)
          print('FINAL_PUBLISHED='+json.dumps({k:v for k,v in final.items() if k!='files'},sort_keys=True))
          PY
