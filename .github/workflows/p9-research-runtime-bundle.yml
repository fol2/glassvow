name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
jobs:
  bundle:
    name: Export already-published fixed replay inputs; no research execution
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 87e5cd3adb18cda1d5cac439d488683ec9cc1781
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/FILES.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/REMOTE-READBACK.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/SOURCE-MANIFEST.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/runtime-source.tar.xz
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/aware/v5-000.outcomes.jsonl.xz
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/aware/v5-000.traces.jsonl.xz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p9-pinned-replay-inputs-87e5cd3a
          path: research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
