name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/acquisition-v1
jobs:
  bundle:
    name: Close preserved acquisition experiment - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            research/p9-six-route/ash-inheritance-20260909/acquisition-v1
            research/p9-six-route/package-disposition-20260908
      - name: Verify prepared source, regression tests and immutable terminal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          p=pathlib.Path(os.environ['STUDY'])/'close_value.py';data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='ab9032e51485c88b7febfef464592977f51beea3651a6ac3ab6e55681e7739e6'
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==subprocess.check_output(['git','rev-parse','HEAD:'+str(p)]).decode().strip()
          PY
          python3 "$STUDY/close_value.py" --self-test
          python3 "$STUDY/close_value.py" .
      - name: Commit only closure evidence and current capsule
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/closure-1" research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/package-disposition-20260908/ROADMAP.md
          git commit -m 'research(p9): close fixed acquisition value failure and preserve positive V5 support'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research/p9-six-route/ash-inheritance-20260909/acquisition-v1
            research/p9-six-route/package-disposition-20260908
      - name: Verify exact committed bytes and independently reconstruct the same decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,subprocess,sys
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')/root
          paths=[root/'close_value.py',*sorted((root/'closure-1').glob('*')),pathlib.Path('research/p9-six-route/SESSION-STATE.json'),pathlib.Path('research/p9-six-route/SESSION-HANDOFF.md'),pathlib.Path('research/p9-six-route/package-disposition-20260908/ROADMAP.md')]
          rows=[]
          for p in paths:
              b=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==b
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert blob==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(p)]).decode().strip()
              rows.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          sys.path.insert(0,str(cold.resolve()))
          import close_value
          load=lambda p:json.loads((cold/p).read_bytes())
          result=close_value.verdict(load('execution-2/TERMINAL.json'),load('execution-2/REMOTE-READBACK.json'),load('execution-2/qualification/RESULTS.json'))
          assert close_value.encoded(result)==(cold/'closure-1/DECISION.json').read_bytes()
          receipt={'kind':'ACQUISITION_CLOSURE_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':rows,'all_bytes_equal':True,'decision_reproduced':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (root/'closure-1/REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain cold readback of acquisition closure and task capsule'
          git push origin HEAD:refs/heads/$branch
