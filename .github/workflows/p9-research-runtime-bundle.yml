name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

jobs:
  bundle:
    name: Export already-published research checkpoint only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact published checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1a0173643a4146991fb2e01c48b0d45f327ee51a
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            domain
            content
            tools
            locale
            tests
            port_fixtures
            research/p9-six-route
            docs/agents
            docs/balance
            docs/rc-bar.md
            .claude/skills/glassvow-godot
            AGENTS.md
            project.godot
          sparse-checkout-cone-mode: false
      - name: Archive tracked sources without executing them
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1a0173643a4146991fb2e01c48b0d45f327ee51a
          mkdir -p bundle
          git archive --format=tar HEAD domain content tools locale tests port_fixtures research/p9-six-route docs/agents docs/balance docs/rc-bar.md .claude/skills/glassvow-godot AGENTS.md project.godot | gzip -n > bundle/source.tar.gz
          git ls-tree -r HEAD > bundle/source-tree.txt
          git rev-parse HEAD > bundle/source-head.txt
          git rev-parse HEAD^{tree} > bundle/source-root-tree.txt
          cd bundle
          sha256sum source.tar.gz source-tree.txt source-head.txt source-root-tree.txt > SHA256SUMS
          printf '%s\n' 'Transport of existing committed sources only. No game, research, test, qualification or P9 execution.' > PURPOSE.txt
      - name: Upload recoverable checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p9-published-checkpoint-1a017364
          path: bundle/
          if-no-files-found: error
          retention-days: 7
