name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/prospective-package-20260911
jobs:
  bundle:
    name: Fix existing policy nominations; no engine or new outcomes
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/p9-research-runtime-bundle.yml
            /research/p9-six-route/prospective-package-20260911/
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/FILES.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/SOURCE-MANIFEST.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/stock-support.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/aware-support.json
      - name: Verify source and execute the one frozen metadata selection
        id: selection
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$STUDY/nomination-1"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          freeze=json.loads((root/'SELECTION-FREEZE.json').read_bytes())
          for name,want in freeze['source_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==want,name
          PY
          (cd "$STUDY" && python3 -m unittest -v test_nominate) > "$RUNNER_TEMP/tests.log" 2>&1
          python3 "$STUDY/nominate.py" "$GITHUB_WORKSPACE" "$STUDY/nomination-1" > "$RUNNER_TEMP/selection.log" 2>&1
      - name: Preserve the actual metadata decision or diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'nomination-1';out.mkdir(exist_ok=True)
          for name in ('tests.log','selection.log'):
              p=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              if p.exists():shutil.copyfile(p,out/name)
          status='EXPOSED_NOMINATIONS_RECORDED_NOT_ADMISSION' if '${{ steps.selection.outcome }}'=='success' else 'NOMINATION_DELIVERY_INCONCLUSIVE'
          (out/'TERMINAL.json').write_text(json.dumps({'status':status,'source_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          paths=[root/n for n in ('nominate.py','test_nominate.py','SELECTION-FREEZE.json')]+[pathlib.Path('.github/workflows/p9-research-runtime-bundle.yml')]
          paths += [p for p in sorted(out.iterdir()) if p.is_file() and p.name!='FILES.json']
          (out/'FILES.json').write_text(json.dumps([{'path':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths],indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git diff --cached --name-only)"
          git add "$STUDY/nomination-1"
          python3 - <<'PY'
          import os,subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert paths and all(p.startswith(os.environ['STUDY']+'/nomination-1/') for p in paths)
          PY
          git commit -m 'research(p9): preserve all exposed nomination scores and selected policy identities'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/p9-research-runtime-bundle.yml
            /research/p9-six-route/prospective-package-20260911/
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/FILES.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/SOURCE-MANIFEST.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/stock-support.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/v5/aware-support.json
      - name: Cold byte readback and deterministic reconstruction; no native replay
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path(os.environ['STUDY']);manifest=root/'nomination-1/FILES.json'
          assert manifest.read_bytes()==(pathlib.Path('cold')/manifest).read_bytes()
          entries=json.loads(manifest.read_bytes())
          for row in entries:
              p=pathlib.Path(row['path']);a=p.read_bytes();b=(pathlib.Path('cold')/p).read_bytes()
              assert a==b and len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256'],str(p)
          terminal=json.loads((root/'nomination-1/TERMINAL.json').read_bytes());reproduced=False
          if terminal['status']=='EXPOSED_NOMINATIONS_RECORDED_NOT_ADMISSION':
              dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'reconstructed-nomination'
              subprocess.run([sys.executable,str(pathlib.Path('cold')/root/'nominate.py'),'cold',str(dest)],check=True)
              for name in ('NOMINATIONS.json','DEVELOPMENT-SCORES.json','INPUTS.json'):
                  assert (dest/name).read_bytes()==(root/'nomination-1'/name).read_bytes(),name
              reproduced=True
          (root/'NOMINATION-READBACK.json').write_text(json.dumps({'kind':'COLD_NOMINATION_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'files':len(entries)+1,'all_bytes_equal':True,'readout_reproduced':reproduced,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/NOMINATION-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/NOMINATION-READBACK.json"
          git commit -m 'research(p9): verify exact nomination bytes and reproduce the fixed ordering'
          git push origin HEAD:refs/heads/$branch
      - name: Keep a failed execution failed
        if: always() && steps.selection.outcome != 'success'
        run: exit 3
