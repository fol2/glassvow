name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bundle:
    name: Publish current source and capacity decisions - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact decision inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout: |
            research/p9-six-route
      - name: Verify code, test negative boundaries and derive current metadata
        shell: bash
        run: |
          set -euo pipefail
          root=research/p9-six-route/minimal-native-20260909
          python3 - <<'PY'
          import hashlib,pathlib
          r=pathlib.Path('research/p9-six-route/minimal-native-20260909')
          expected={'close_native.py':'040ead41ebd64b26360c8dce80bd9a3516d0774af0daf22668efdd9260ce909a','test_close.py':'d800e0b559dc4068288b48f53848abcc41405baadc0d27664a621d4739ad87dc'}
          for n,h in expected.items():assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          PY
          (cd "$root" && python3 -m unittest -v test_close) > "$root/CLOSURE-TESTS.log" 2>&1
          python3 "$root/close_native.py" .
      - name: Commit only the exact current decision and capsule
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git add research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/package-disposition-20260908/ROADMAP.md research/p9-six-route/minimal-native-20260909/DECISION.json research/p9-six-route/minimal-native-20260909/CLOSURE-TESTS.log
          python3 - <<'PY'
          import subprocess
          root='research/p9-six-route/'
          expected={root+n for n in ('SESSION-STATE.json','SESSION-HANDOFF.md','package-disposition-20260908/ROADMAP.md','minimal-native-20260909/DECISION.json','minimal-native-20260909/CLOSURE-TESTS.log')}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert actual==expected,actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve native Smolder priority and Dusk sampler closure'
          git push origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read published metadata from a separate checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.publish.outputs.sha }}
          path: cold-readback
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            research/p9-six-route
      - name: Verify every delivered byte and preserve receipt
        env:
          PUBLISHED: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('research/p9-six-route');r=root/'minimal-native-20260909';cold=pathlib.Path('cold-readback')
          paths=[root/'SESSION-STATE.json',root/'SESSION-HANDOFF.md',root/'package-disposition-20260908/ROADMAP.md']+[r/n for n in ('DECISION.json','CLOSURE-TESTS.log','close_native.py','test_close.py')]
          files=[]
          for path in paths:
              a=path.read_bytes();b=(cold/path).read_bytes();assert a==b,str(path)
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              expected=subprocess.check_output(['git','rev-parse','HEAD:'+str(path)]).decode().strip();assert blob==expected,str(path)
              files.append({'path':str(path),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          receipt={'kind':'COLD_REMOTE_NATIVE_FRONTIER_METADATA_READBACK','source_head':os.environ['GITHUB_SHA'],'published_head':os.environ['PUBLISHED'],'workflow_run':os.environ['GITHUB_RUN_ID'],'files_matched':len(files),'files':files,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False}
          (r/'FRONTIER-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('FRONTIER_READBACK='+json.dumps({k:v for k,v in receipt.items() if k!='files'},sort_keys=True))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git add research/p9-six-route/minimal-native-20260909/FRONTIER-READBACK.json
          git commit -m 'research(p9): persist current native-frontier readback receipt'
          git push origin "HEAD:refs/heads/$branch"
