name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-value-v1
jobs:
  bundle:
    name: Close the complete Hand value decision - no engine or new observations
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route
      - name: Verify exact source and original raw; reproduce only the frozen readout
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          for name,expected in {'close_value.py':'8ee0c7359235ce0e2cf76247bdaebcc03346019a','test_close_value.py':'fcb114a13d65bd792e4df117746412b2228c2ddc'}.items():
              data=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected,name
          assert (root/'execution-1/REMOTE-READBACK.json').is_file()
          assert not (root/'closure-1').exists()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_close_value) > "$RUNNER_TEMP/hand-close-tests.log" 2>&1
          python3 "$STUDY/close_value.py" run "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/closure-1" > "$RUNNER_TEMP/hand-close-audit.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'closure-1'
          records=json.loads((out/'FILES.json').read_bytes())
          for path in sorted(pathlib.Path(os.environ['RUNNER_TEMP']).glob('hand-close-*.log')):
              p=out/path.name;shutil.copyfile(path,p);data=p.read_bytes()
              records.append({'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Publish only verified closure, or retain actual failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.audit.outcome }}' = success ]; then
            git add "$STUDY/closure-1" research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/SESSION-STATE.json research/p9-six-route/package-disposition-20260908/ROADMAP.md
          else
            mkdir "$STUDY/closure-delivery-1"
            cp "$RUNNER_TEMP"/hand-close-*.log "$STUDY/closure-delivery-1/" 2>/dev/null || true
            printf '%s\n' '{"status":"HAND_CLOSURE_DELIVERY_INCOMPLETE","new_native_runs":0,"packages_admitted":0,"p9_certified":false}' > "$STUDY/closure-delivery-1/TERMINAL.json"
            git add "$STUDY/closure-delivery-1"
          fi
          python3 - <<'PY'
          import os,subprocess
          root=os.environ['STUDY'];paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          shared={'research/p9-six-route/'+n for n in ('SESSION-HANDOFF.md','SESSION-STATE.json','package-disposition-20260908/ROADMAP.md')}
          assert paths and all(p in shared or p.startswith(root+'/closure-1/') or p.startswith(root+'/closure-delivery-1/') for p in paths)
          PY
          git commit -m 'research(p9): preserve exact Hand adaptive-value disposition and actual diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.audit.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Read back committed source, closure and capsule bytes from a separate checkout
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/close_value.py" verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/closure-1/REMOTE-READBACK.json"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record exact cold readback of Hand closure and current handoff'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reject incomplete closure without reclassifying native results
        if: always() && steps.audit.outcome != 'success'
        run: exit 3
