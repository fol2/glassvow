name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bundle:
    name: One native-Ash restoration - fixed disjoint signed controls
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact frozen inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /domain/
            /content/
            /tools/
            /research/p9-six-route/source-package-audit-20260908/
            /research/p9-six-route/natural-contribution-20260907/diagnostic_rules.gd
            /research/p9-six-route/guardrail-confirmation-20260909/
            /research/p9-six-route/candidate-failure-20260909/attribution.py
            /research/p9-six-route/native-foundation-20260909/
      - name: Verify the single candidate and fixed gate before new outcomes
        shell: bash
        run: |
          set -euo pipefail
          root=research/p9-six-route/native-foundation-20260909
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('research/p9-six-route/native-foundation-20260909')
          b=(r/'PROTOCOL.json').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='0ebcc9dbece994506d2d2037670f21d4c9342970aa28a8ede0b583e7c6e91a3f'
          for name,h in json.loads(b)['source_sha256'].items():assert hashlib.sha256((r/name).read_bytes()).hexdigest()==h,name
          PY
          (cd "$root" && python3 -m unittest -v test_foundation) > "$root/TESTS.log" 2>&1
      - name: Bind the existing official engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p9-engine"
          curl --fail --location --max-time 120 --output "$RUNNER_TEMP/p9-engine/engine.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/p9-engine/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p9-engine/engine.zip" -d "$RUNNER_TEMP/p9-engine"
          chmod +x "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64" | sha256sum -c -
      - name: Execute the one frozen disjoint control rectangle
        shell: bash
        run: |
          set -euo pipefail
          root=research/p9-six-route/native-foundation-20260909
          python3 -u "$root/foundation.py" . "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64" "$root/native-1" > "$root/EXECUTION.stdout" 2> "$root/EXECUTION.stderr"
      - name: Commit all available new capture without touching old negatives
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          root=research/p9-six-route/native-foundation-20260909
          git add "$root"
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert paths and all(p.startswith('research/p9-six-route/native-foundation-20260909/') and '__pycache__' not in p for p in paths),'STAGED_SCOPE'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve restored-foundation signed-control result and full raw'
          git push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch published evidence into a separate checkout
        if: always() && steps.publish.outputs.head != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.publish.outputs.head }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/native-foundation-20260909/
            /research/p9-six-route/guardrail-confirmation-20260909/
            /research/p9-six-route/candidate-failure-20260909/attribution.py
      - name: Verify every published byte and independently reconstruct the same readout
        if: always() && steps.publish.outputs.head != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path('research/p9-six-route/native-foundation-20260909');cold=pathlib.Path('cold');observed=[]
          for entry in subprocess.check_output(['git','-C','cold','ls-tree','-r','-z','HEAD','--',str(root)]).split(b'\0'):
              if not entry:continue
              meta,path=entry.split(b'\t');name=path.decode();expected=meta.split()[2].decode();b=(cold/name).read_bytes()
              assert b==pathlib.Path(name).read_bytes(),name
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest();assert blob==expected,name
              observed.append({'path':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          proof=subprocess.check_output([sys.executable,str(cold/root/'foundation.py'),'--verify',str(cold),str(cold/root/'native-1')])
          receipt={'kind':'COLD_REMOTE_BYTE_READBACK_AND_OFFLINE_RECONSTRUCTION','freeze_head':'9950059c98d2db245b0023a9c7f29dc79ef7c241','workflow_head':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],'published_head':subprocess.check_output(['git','-C','cold','rev-parse','HEAD']).decode().strip(),'files_matched':len(observed),'files':observed,'reconstruction':json.loads(proof),'new_native_runs':0,'packages_admitted':0,'p9_certified':False,'review':'AUTHOR_SELF_REVIEW_NOT_INDEPENDENT; separate checkout is byte independence, not a second scientific sample or semantic oracle.'}
          (root/'REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='files'},sort_keys=True))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git add research/p9-six-route/native-foundation-20260909/REMOTE-READBACK.json
          git commit -m 'research(p9): persist restored-foundation exact-byte remote receipt'
          git push origin "HEAD:refs/heads/$branch"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
