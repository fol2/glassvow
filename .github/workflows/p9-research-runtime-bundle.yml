name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bundle:
    name: Close measured candidate paths and current capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact closure inputs only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
            /research/p9-six-route/guardrail-confirmation-20260909/native-1/RESULTS.json
            /research/p9-six-route/candidate-failure-20260909/native-1/RESULTS.json
            /research/p9-six-route/candidate-failure-20260909/REMOTE-READBACK.json
            /research/p9-six-route/native-foundation-20260909/native-1/RESULTS.json
            /research/p9-six-route/native-foundation-20260909/REMOTE-READBACK.json
            /research/p9-six-route/candidate-decision-20260909/
      - name: Verify closure code, test exact boundaries, derive metadata
        shell: bash
        run: |
          set -euo pipefail
          root=research/p9-six-route/candidate-decision-20260909
          echo "b03d1eaa3e00b1d1a59d4b8ce02ebf3f2de6b8c55ee3dcf85c13cabc6b10ac25  $root/close_decision.py" | sha256sum -c -
          echo "42584266f452235cd16a8184e0a0b24cff518e7571bce1ac684421ee428fc6aa  $root/test_close_decision.py" | sha256sum -c -
          (cd "$root" && python3 -m unittest -v test_close_decision) > "$root/TESTS.log" 2>&1
          python3 "$root/close_decision.py" .
      - name: Publish only current metadata and its deterministic decision
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/package-disposition-20260908/ROADMAP.md research/p9-six-route/candidate-decision-20260909/DECISION.json research/p9-six-route/candidate-decision-20260909/TESTS.log
          python3 - <<'PY'
          import subprocess
          prefix='research/p9-six-route/'
          expected={prefix+x for x in ('SESSION-STATE.json','SESSION-HANDOFF.md','package-disposition-20260908/ROADMAP.md','candidate-decision-20260909/DECISION.json','candidate-decision-20260909/TESTS.log')}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          assert actual==expected,'PUBLICATION_SCOPE'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): close tested candidate paths and retire stale continuation state'
          git push origin "HEAD:refs/heads/$branch"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch published metadata into a separate checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.publish.outputs.head }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
            /research/p9-six-route/candidate-decision-20260909/
      - name: Verify all published bytes and preserve receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          r=pathlib.Path('research/p9-six-route')
          names=[str(r/x) for x in ('SESSION-STATE.json','SESSION-HANDOFF.md','package-disposition-20260908/ROADMAP.md')]
          names+=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','--',str(r/'candidate-decision-20260909')]).decode().splitlines()
          files=[]
          for name in names:
              b=pathlib.Path(name).read_bytes();downloaded=(pathlib.Path('cold')/name).read_bytes()
              assert b==downloaded,name
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert blob==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+name]).decode().strip(),name
              files.append({'path':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          receipt={'kind':'COLD_REMOTE_CURRENT_CAPSULE_BYTE_READBACK','source_head':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],'published_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files_matched':len(files),'files':files,'new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (r/'candidate-decision-20260909/REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='files'},sort_keys=True))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git add research/p9-six-route/candidate-decision-20260909/REMOTE-READBACK.json
          git commit -m 'research(p9): preserve current-capsule remote readback'
          git push origin "HEAD:refs/heads/$branch"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
