name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

jobs:
  bundle:
    name: Derive all proper subwords from retained native graph - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      STUDY: research/p9-six-route/package-proof-20260908/facet-language-v1
    steps:
      - name: Check out exact committed inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout: research/p9-six-route/package-proof-20260908/facet-language-v1
      - name: Verify sources, execute offline reader and retain all results
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          study=pathlib.Path(os.environ['STUDY']).resolve()
          source=study/'subsequence'; out=source/'derived-1'
          if out.exists():raise RuntimeError('OUTPUT_ALREADY_EXISTS')
          expected={'read_subsequences.py':'1543da716bbe0f05c1d71022d336ef1e8937178eb13032145c2d223902b13715','test_subsequences.py':'2c62994064f93bf08304f6b2076c57007430a55aae4d926a6adc49bd949dd05c'}
          sha=lambda b:hashlib.sha256(b).hexdigest()
          identities={}
          for name,h in expected.items():
              b=(source/name).read_bytes()
              if sha(b)!=h:raise RuntimeError('SOURCE_IDENTITY:'+name)
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              path=(source/name).relative_to(pathlib.Path.cwd())
              if blob!=subprocess.check_output(['git','rev-parse','HEAD:'+str(path)]).decode().strip():raise RuntimeError('SOURCE_GIT_BLOB')
              identities[name]={'sha256':h,'git_blob':blob,'bytes':len(b)}
          out.mkdir()
          tests=subprocess.run([sys.executable,'-m','unittest','-v','test_subsequences'],cwd=source,capture_output=True,timeout=30)
          (out/'TESTS.log').write_bytes(tests.stdout+tests.stderr)
          result=subprocess.run([sys.executable,str(source/'read_subsequences.py'),str(study)],capture_output=True,timeout=90)
          (out/'DERIVATION.log').write_bytes(result.stderr)
          status='INCONCLUSIVE_READER_OR_TEST_FAILURE';parsed=None
          if result.returncode==0:
              parsed=json.loads(result.stdout)
              (out/'RESULTS.json').write_bytes(result.stdout)
              if tests.returncode==0 and b'Ran 8 tests' in tests.stderr:status='BOUNDED_PROPER_SUBWORD_CERTIFICATE_NOT_PACKAGE_ADMISSION'
          else:(out/'FAILED-OUTPUT.log').write_bytes(result.stdout)
          files={p.name:{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes()),'git_blob':hashlib.sha1(b'blob '+str(p.stat().st_size).encode()+b'\0'+p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()}
          receipt={'status':status,'source_head':os.environ['GITHUB_SHA'],'input_evidence_head':'f36d1428e595711aa997fd3ff8cea633c4df319a','sources':identities,'reader_returncode':result.returncode,'tests_returncode':tests.returncode,'tests':8,'files':files,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False}
          if parsed:
              receipt['positional_proper_subsets']=parsed['positional_proper_subsets']
              receipt['cases']=[{k:c[k] for k in ('vow','up','parent_minimum_commands','positional_proper_subsets','distinct_retained_prefix_words','outcomes','all_retained_consumer_proper_subwords_fail_specified_goal')} for c in parsed['cases']]
          (out/'EXECUTION-RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('DERIVED_RECEIPT='+json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve the reader output without rewriting source or native evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          out="$STUDY/subsequence/derived-1"
          git add "$out"
          python3 - <<'PY'
          import os,subprocess
          prefix=os.environ['STUDY']+'/subsequence/derived-1/'
          paths=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          allowed={'RESULTS.json','TESTS.log','DERIVATION.log','FAILED-OUTPUT.log','EXECUTION-RECEIPT.json'}
          if not paths or any(not p.startswith(prefix) or p[len(prefix):] not in allowed for p in paths):raise RuntimeError('STAGED_SCOPE')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve exhaustive proper-subword derivation without native replay'
          git push origin "HEAD:refs/heads/$branch"
          printf 'PUBLISHED_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['STUDY'])/'subsequence/derived-1/EXECUTION-RECEIPT.json').read_bytes())
          if r['status']!='BOUNDED_PROPER_SUBWORD_CERTIFICATE_NOT_PACKAGE_ADMISSION':raise RuntimeError(r['status'])
          PY
