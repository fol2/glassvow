name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1/one-sample-v1/closure-1
jobs:
  bundle:
    name: Complete retained support diagnosis - no engine or new cohort
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909
      - name: Verify committed inputs, test interpretation, read every assigned run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          for name in ('audit_capture.py','DECISION.json'):
              p=root/name;b=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==subprocess.check_output(['git','rev-parse','HEAD:'+str(p)]).decode().strip()
          PY
          python3 "$STUDY/audit_capture.py" --self-test > "$RUNNER_TEMP/one-sample-audit-tests.log" 2>&1
          python3 "$STUDY/audit_capture.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/capture-audit" > "$RUNNER_TEMP/one-sample-audit.stdout" 2> "$RUNNER_TEMP/one-sample-audit.stderr"
          cp "$RUNNER_TEMP/one-sample-audit-tests.log" "$STUDY/capture-audit/TESTS.log"
          cp "$RUNNER_TEMP/one-sample-audit.stdout" "$STUDY/capture-audit/runner.stdout"
          cp "$RUNNER_TEMP/one-sample-audit.stderr" "$STUDY/capture-audit/runner.stderr"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/capture-audit"
          git diff --cached --name-only | awk -v prefix="$STUDY/capture-audit/" 'index($0,prefix)!=1 {exit 1}'
          git commit -m 'research(p9): preserve complete one-sample acquisition and enactment diagnosis'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909
      - name: Read back all new bytes and independently re-run only the offline reader
        shell: bash
        run: |
          set -euo pipefail
          python3 "cold/$STUDY/audit_capture.py" "$GITHUB_WORKSPACE/cold" "$RUNNER_TEMP/one-sample-audit-cold"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold');records=[]
          files=[root/'audit_capture.py',root/'DECISION.json',*sorted((root/'capture-audit').glob('*'))]
          for p in files:
              b=p.read_bytes();assert (cold/p).read_bytes()==b,str(p)
              records.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          replay=pathlib.Path(os.environ['RUNNER_TEMP'])/'one-sample-audit-cold'
          for name in ('RESULTS.json','stock-rows.json','planner-rows.json'):
              assert (replay/name).read_bytes()==(root/'capture-audit'/name).read_bytes(),name
          result=json.loads((root/'capture-audit/RESULTS.json').read_bytes())
          receipt={'kind':'COMPLETE_ONE_SAMPLE_AUDIT_COLD_READBACK','source_head':os.environ['GITHUB_SHA'],'published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':records,'all_bytes_equal':True,'readout_reproduced':True,'result_sha256':hashlib.sha256((root/'capture-audit/RESULTS.json').read_bytes()).hexdigest(),'new_native_runs':0,'packages_admitted':0,'p9_certified':False}
          (root/'REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'decision':result['decision'],'policy_counts':{m:r['policy_counts'] for m,r in result['methods'].items()}},indent=2))
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain cold byte proof of complete one-sample diagnosis'
          git push origin HEAD:refs/heads/$branch
