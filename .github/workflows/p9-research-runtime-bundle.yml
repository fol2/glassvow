name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-value-v1/source-path-census-1
jobs:
  bundle:
    name: Complete four-world source-path census - no native replay
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route
      - name: Verify sources and read every assigned retained world
        id: census
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          for n,h in {'census.py':'322a7e1b5845aba19ff3b33cbdedeab8da48d10a','test_census.py':'b5bed0ba4c365daf7026488af0904917242d2ebc'}.items():
              b=(root/n).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
              assert subprocess.check_output(['git','rev-parse','HEAD:'+str(root/n)]).decode().strip()==h
          assert not (root/'execution-1').exists()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_census) > "$RUNNER_TEMP/hand-census-tests.log" 2>&1
          python3 "$STUDY/census.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/execution-1" > "$RUNNER_TEMP/hand-census-run.log" 2>&1
      - name: Preserve full result or the concrete failed obligation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'execution-1';out.mkdir(exist_ok=True)
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('hand-census-*.log'):shutil.copyfile(p,out/p.name)
          status='COMPLETE_POST_OBSERVATION_CENSUS' if '${{ steps.census.outcome }}'=='success' else 'CENSUS_DELIVERY_OR_SCOPE_FAILURE'
          (out/'TERMINAL.json').write_text(json.dumps({'status':status,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          paths=[root/'census.py',root/'test_census.py']+sorted(p for p in out.iterdir() if p.is_file())
          records=[]
          for p in paths:
              b=p.read_bytes();records.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          (out/'DELIVERY-FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/execution-1"
          python3 - <<'PY'
          import os,subprocess
          prefix=os.environ['STUDY']+'/execution-1/'
          names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert names and all(n.startswith(prefix) for n in names)
          PY
          git commit -m 'research(p9): retain every assigned Hand source path and paired response without new outcomes'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Compare bytes and reproduce the census without an engine
        if: env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,tempfile
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')/root;out=root/'execution-1'
          a=(out/'DELIVERY-FILES.json').read_bytes();assert a==(cold/'execution-1/DELIVERY-FILES.json').read_bytes()
          records=json.loads(a)
          for r in records:
              p=pathlib.Path(r['path']);assert not p.is_absolute() and '..' not in p.parts
              b=(cold/p).read_bytes();assert b==(root/p).read_bytes() and len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
              h=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert h==r['git_blob']==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(root/p)]).decode().strip()
          reproduced=False
          if '${{ steps.census.outcome }}'=='success':
              with tempfile.TemporaryDirectory(prefix='hand-census-cold-') as d:
                  target=pathlib.Path(d)/'reproduced'
                  subprocess.run([sys.executable,str(cold/'census.py'),str(pathlib.Path('cold').resolve()),str(target)],check=True,stdout=subprocess.DEVNULL)
                  for name in ('RESULTS.json','FIELDS.jsonl','RUN-COVERAGE.json','INPUTS.json','FILES.json'):
                      assert (target/name).read_bytes()==(cold/'execution-1'/name).read_bytes(),name
              reproduced=True
          receipt={'kind':'COMPLETE_HAND_SOURCE_CENSUS_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'files':records,'all_bytes_equal':True,'full_census_reproduced':reproduced,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False}
          (out/'REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/execution-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): bind cold-reproduced complete source-path census'
          git push origin HEAD:refs/heads/$branch
      - name: Fail closed if the census did not complete
        if: always() && steps.census.outcome != 'success'
        run: exit 3
