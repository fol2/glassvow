name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
jobs:
  bundle:
    name: Read missing selected-content construction - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909
      - name: Preserve the exact missing recipe sources, do not execute them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,hashlib,io,json,pathlib,tarfile
          root=pathlib.Path('research/p9-six-route/ash-inheritance-20260909')
          raw=(root/'binding-1/inputs/harness.tar.gz').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='0e963a6dfadb87912f9b1074b78d8629bbad2a47'
          out=root/'minimal-v1/recipe-inputs';out.mkdir(exist_ok=False)
          names=['post_v38_factorial.py','post_v38_blocked_crn.py','post_v38_knob_identity.py','post_v38_knob_identity_v2.py']
          manifest={}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              for name in names:
                  m=tf.getmember(name);assert m.isfile() and m.size<1000000
                  data=tf.extractfile(m).read();(out/name).write_bytes(data)
                  tree=ast.parse(data)
                  outline=[{'name':getattr(n,'name','assignment'),'start':n.lineno,'end':n.end_lineno} for n in tree.body if isinstance(n,(ast.FunctionDef,ast.Assign,ast.AnnAssign))]
                  manifest[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'outline':outline}
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('RECIPE_SOURCE_OUTLINE='+json.dumps(manifest,sort_keys=True))
          PY
      - name: Commit isolated source evidence
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add research/p9-six-route/ash-inheritance-20260909/minimal-v1/recipe-inputs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve selected-substrate construction for exact projection'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/minimal-v1
      - name: Read back all new source bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('research/p9-six-route/ash-inheritance-20260909/minimal-v1')
          checks=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  data=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==data
                  checks.append({'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          print('EXACT_REMOTE_READBACK='+json.dumps(checks,sort_keys=True))
          PY
