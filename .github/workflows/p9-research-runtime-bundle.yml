name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false

jobs:
  bundle:
    name: Fixed natural Hand support - all evidence preserved
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out exact frozen support implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route
      - name: Verify fixed scientific inputs and delivery-only slicing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('research/p9-six-route/hand-admission-20260908/support-v1')
          p=json.loads((r/'PROTOCOL.json').read_bytes())
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(json.dumps(p,sort_keys=True,separators=(',',':')).encode())=='9f7b3ccc6e9560fa8df7a60e29382c57c53da46bcf09d2be616fb76430e62ca2'
          for name,digest in p['source_sha256'].items():
              assert sha((r/name).read_bytes())==digest,name
          assert sha((r/'execute_support.py').read_bytes())=='a484844a3f5da58278aeea37dd199f3b2702cf5e6e759cf403c2d1e898e69ae8'
          PY
          cd research/p9-six-route/hand-admission-20260908/support-v1
          python3 -m unittest -v test_support
      - name: Obtain the already-authorised pinned official engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p9-engine"
          curl --fail --location --max-time 120 --output "$RUNNER_TEMP/p9-engine/engine.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/p9-engine/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/p9-engine/engine.zip" -d "$RUNNER_TEMP/p9-engine"
          chmod +x "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64"
      - name: Validate integration then execute fixed V5 and conditional V0
        shell: bash
        run: |
          set -euo pipefail
          root=research/p9-six-route/hand-admission-20260908/support-v1
          python3 -u "$root/execute_support.py" . "$RUNNER_TEMP/p9-engine/Godot_v4.7.2-stable_linux.x86_64" "$root/capture-1" --push
      - name: Verify terminal state without promoting a scientific negative
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/p9-six-route/hand-admission-20260908/support-v1/capture-1/TERMINAL.json')
          assert p.exists(),'No complete terminal: do not report support or P9 PASS.'
          r=json.loads(p.read_bytes())
          print(json.dumps({k:v for k,v in r.items() if k!='readbacks'},sort_keys=True))
          assert not r['p9_certified'] and r['packages_admitted']==0
          assert r['status']!='INCONCLUSIVE',r.get('failure')
          PY
