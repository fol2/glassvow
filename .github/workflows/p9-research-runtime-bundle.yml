name: P9 research runtime bundle

on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]

permissions:
  contents: read

jobs:
  bundle:
    name: Package pinned research runtime only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2ed6cdb0302ba3aab5845a18d862841165e8aaf7
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            domain
            content
            tools
            locale
            tests
            port_fixtures
            project.godot
          sparse-checkout-cone-mode: false
      - name: Collect exact source and pinned engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/engine
          test "$(git rev-parse HEAD)" = 2ed6cdb0302ba3aab5845a18d862841165e8aaf7
          git archive --format=tar HEAD domain content tools locale tests port_fixtures project.godot | gzip -n > bundle/source.tar.gz
          curl --fail --location --retry 2 --output bundle/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  bundle/godot.zip' | sha256sum --check --strict
          unzip -q bundle/godot.zip -d bundle/engine
          chmod 0555 bundle/engine/Godot_v4.7.2-stable_linux.x86_64
          echo '8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  bundle/engine/Godot_v4.7.2-stable_linux.x86_64' | sha256sum --check --strict
          bundle/engine/Godot_v4.7.2-stable_linux.x86_64 --headless --version | tee bundle/godot-version.txt
          rm -r bundle/engine
          git ls-tree -r HEAD -- domain content tools locale tests port_fixtures project.godot > bundle/source-tree.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('bundle')
          records = {p.name: {'size': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file()}
          report = {'schema': 'glassvow.p9.research-runtime-bundle/v1', 'purpose': 'Transport for isolated research; not a qualification, game result or P9 certificate', 'productSha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'productTree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'files': records}
          (root/'manifest.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Upload private research bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p9-research-runtime-2ed6cdb
          path: bundle/
          if-no-files-found: error
          retention-days: 3
