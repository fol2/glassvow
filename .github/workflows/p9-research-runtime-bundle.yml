name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/causal-value-v1
jobs:
  bundle:
    name: Four fixed package worlds - unchanged policy, source utility and causal bars
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            domain
            content
            tools
            research/p9-six-route
      - name: Verify committed inputs and falsifying tests before observations
        id: binding
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          expected={'CONTRACT.json':'1172fdaa598b2d3f9c02ba19d1c23fb2f029f5e7','plumbing_gate.gd':'7a2100079b8357ed1b52470772bb6187035fe9ea','qualify.py':'6101dc96c4cea87b6f4aa07cdc640c50bad765d0','read_causal.py':'9113e3f97534aaac29e295d2212abc1eb416b514','run_causal.py':'8965d0897b7c36ae5ab0f5992a3bb374edd10777'}
          files={}
          for name in (*expected,'test_causal.py','test_utility_hp.py'):
              p=root/name;b=p.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if name in expected:assert actual==expected[name],name
              assert actual==subprocess.check_output(['git','rev-parse','HEAD:'+str(p)]).decode().strip()
              files[name]=hashlib.sha256(b).hexdigest()
          assert not (root/'SOURCE-FREEZE.json').exists()
          assert not (root/'execution-1').exists()
          (root/'SOURCE-FREEZE.json').write_text(json.dumps({'source_head':os.environ['GITHUB_SHA'],'source_sha256':files,'native_rows_at_freeze':0,'review_kind':'AUTHOR_SELF_REVIEW_NOT_INDEPENDENT','delivery_correction':'Reader respects native lethal HP clamp; fixture, protocol, product and primary readout unchanged.','p9_certified':False},indent=2)+'\n')
          PY
          (cd "$STUDY" && timeout 120s python3 -m unittest -v test_causal test_utility_hp) > "$RUNNER_TEMP/causal-tests.log" 2>&1
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/SOURCE-FREEZE.json"
          git commit -m 'research(p9): freeze verified four-world sources before native observations'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify source and clone semantics before the fixed conditional causal stages
        id: native
        if: steps.binding.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
          } > "$RUNNER_TEMP/causal-engine.log" 2>&1
          python3 "$STUDY/run_causal.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/causal-work" --publish > "$RUNNER_TEMP/causal-run.stdout" 2> "$RUNNER_TEMP/causal-run.stderr"
      - name: Preserve every available byte and the actual terminal even after failure
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'execution-1';out.mkdir(exist_ok=True)
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('causal-*'):
              if p.is_file():shutil.copyfile(p,out/p.name)
          terminal=out/'TERMINAL.json'
          if not terminal.exists():terminal.write_text(json.dumps({'status':'INCONCLUSIVE','failure':'SOURCE_BINDING_OR_ENGINE_ENTRY_FAILED','source_head':os.environ['GITHUB_SHA'],'stages':{},'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          records=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'FILES.json']
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          source=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()]
          (out/'SOURCE-FILES.json').write_text(json.dumps(source,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STUDY"
          git diff --cached --name-only | awk -v prefix="$STUDY/" 'index($0,prefix)!=1 {exit 1}'
          git commit -m 'research(p9): preserve actual causal terminal, complete capture and diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            research/p9-six-route
      - name: Cold-read source and raw bytes and reproduce only opened causal decisions
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold');out=root/'execution-1'
          src=(out/'SOURCE-FILES.json').read_bytes()
          assert src==(cold/out/'SOURCE-FILES.json').read_bytes()
          for e in json.loads(src):
              p=pathlib.Path(e['path']);assert not p.is_absolute() and '..' not in p.parts
              a=(root/p).read_bytes();b=(cold/root/p).read_bytes()
              assert a==b and len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
          receipt=out/'REMOTE-READBACK.json'
          subprocess.run(['python3',str(cold/root/'run_causal.py'),'verify',str(cold.resolve()),str(out.resolve()),str((cold/out).resolve()),str(receipt.resolve())],check=True)
          (out/'SOURCE-READBACK.json').write_text(json.dumps({'source_head':os.environ['GITHUB_SHA'],'published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'source_files':len(json.loads(src)),'all_source_bytes_equal':True,'new_native_runs':0,'packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-1/REMOTE-READBACK.json" "$STUDY/execution-1/SOURCE-READBACK.json"
          git commit -m 'research(p9): retain independent checkout byte proof of causal worlds'
          git push origin HEAD:refs/heads/$branch
      - name: Report delivery separately from scientific success
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          t=json.loads((pathlib.Path(os.environ['STUDY'])/'execution-1/TERMINAL.json').read_bytes())
          print(json.dumps(t,indent=2))
          sys.exit(3 if t['status']=='INCONCLUSIVE' else 0)
          PY
