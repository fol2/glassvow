name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1/value-v1
jobs:
  bundle:
    name: Read complete preassigned blocks only - no engine or new support stage
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909
      - name: Bind audit source, check negative regressions, reconstruct frozen readout
        shell: bash
        run: |
          set -euo pipefail
          echo "437075fb52bdac0758aed5af29a2534b8214c24b781038a0343aa03f789c7d11  $STUDY/audit_value_terminal.py" | sha256sum -c -
          echo "d54a44d39d23669dbbfe573e3898a14924936b2d3d314c664493f92a660e4b42  $STUDY/test_audit_value_terminal.py" | sha256sum -c -
          mkdir "$STUDY/postrun-1"
          (cd "$STUDY" && python3 -m unittest -v test_audit_value_terminal) > "$STUDY/postrun-1/tests.stdout" 2> "$STUDY/postrun-1/tests.stderr"
          python3 "$STUDY/audit_value_terminal.py" . > "$STUDY/postrun-1/RESULTS.json" 2> "$STUDY/postrun-1/audit.stderr"
          cat "$STUDY/postrun-1/RESULTS.json"
      - name: Preserve complete bounded readout, not a new verdict
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$STUDY/postrun-1"
          git commit -m 'research(p9): preserve full fixed planner performance and actual resource exceedance'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909
      - name: Reconstruct result from committed capture without native execution
        shell: bash
        run: |
          set -euo pipefail
          python3 "cold/$STUDY/audit_value_terminal.py" cold > "$RUNNER_TEMP/cold-result.json"
          cmp "$STUDY/postrun-1/RESULTS.json" "$RUNNER_TEMP/cold-result.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);records=[]
          paths=[root/'audit_value_terminal.py',root/'test_audit_value_terminal.py',*sorted((root/'postrun-1').glob('*'))]
          for p in paths:
              b=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==b
              blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert blob==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(p)]).decode().strip()
              records.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':blob})
          result=json.loads((root/'postrun-1/RESULTS.json').read_bytes())
          receipt={'kind':'POST_RESOURCE_TERMINAL_COMPLETE_BLOCK_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],'files':records,'all_bytes_equal':True,'same_frozen_readout_reproduced':True,'original_terminal':result['terminal_unchanged']['status'],'new_native_runs':0,'support_stage_newly_opened':False,'packages_admitted':0,'p9_certified':False}
          (root/'postrun-1/REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/postrun-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain cold proof of fixed-block resource-terminal audit'
          git push origin HEAD:refs/heads/$branch
