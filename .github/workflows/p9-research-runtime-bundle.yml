name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
jobs:
  bundle:
    name: Complete unchanged Hand source closure after indentation repair - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1/
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Repair manifest ordering and complete only the missing source closure
        id: closure
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);p=root/'finalize.py';b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='54d21b6d6a3ff38370788534c81751eea2d59c76'
          assert not (root/'closure-1').exists()
          old="    paths=[root/'finalize.py',root/'close.py',root/'descriptor.py',root/'descriptor-1/SYNC-MANIFEST.json']"
          new='\n'.join([
              '    # Bind the inner manifest after final capsule mutations.',
              "    sync_path=root/'descriptor-1/SYNC-MANIFEST.json'",
              '    sync_records=load(sync_path)',
              "    require(len({r['path'] for r in sync_records})==len(sync_records),'SYNC_DUPLICATE_PATH')",
              '    for r in sync_records:',
              "        relative=Path(r['path'])",
              "        require(not relative.is_absolute() and '..' not in relative.parts,'SYNC_PATH')",
              '        data=(repo/relative).read_bytes()',
              '        r.update(bytes=len(data),sha256=sha(data),git_blob=blob(data))',
              '    save(sync_path,sync_records)',
              "    paths=[root/'finalize.py',root/'test_finalize.py',root/'close.py',root/'descriptor.py',sync_path]",
          ])
          text=b.decode();assert text.count(old)==1
          changed=text.replace(old,new,1);compile(changed,str(p),'exec');p.write_text(changed)
          PY
          (cd "$STUDY" && python3 -m unittest -v test_finalize) > "$RUNNER_TEMP/hand-final-tests.log" 2>&1
          python3 "$STUDY/finalize.py" run "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/closure-1" > "$RUNNER_TEMP/hand-final-run.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY']);out=root/'closure-1'
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('hand-final-*.log'):shutil.copyfile(p,out/p.name)
          manifest=json.loads((out/'FILES.json').read_bytes())
          for p in out.glob('*.log'):
              b=p.read_bytes();manifest.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          (out/'FILES.json').write_text(json.dumps(manifest,indent=2)+'\n')
          for r in json.loads((root/'descriptor-1/SYNC-MANIFEST.json').read_bytes()):
              b=pathlib.Path(r['path']).read_bytes();assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
          PY
      - name: Publish coherent source and closure or retain actual failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.closure.outcome }}' = success ]; then
            git add "$STUDY/finalize.py" "$STUDY/closure-1" "$STUDY/descriptor-1/SYNC-MANIFEST.json" research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/SESSION-STATE.json research/p9-six-route/package-disposition-20260908/ROADMAP.md
          else
            mkdir "$STUDY/closure-delivery-2"
            cp "$RUNNER_TEMP"/hand-final-*.log "$STUDY/closure-delivery-2/" 2>/dev/null || true
            printf '%s\n' '{"status":"CLOSURE_DELIVERY_INCOMPLETE","new_native_runs":0,"packages_admitted":0,"p9_certified":false}' > "$STUDY/closure-delivery-2/TERMINAL.json"
            git add "$STUDY/closure-delivery-2"
          fi
          git commit -m 'research(p9): preserve checked Hand closure and actual delivery diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.closure.outcome == 'success' && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1/
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Read committed bytes and reconstruct the complete inherited call path
        if: steps.closure.outcome == 'success' && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 "cold/$STUDY/finalize.py" verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/closure-1/REMOTE-READBACK.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')
          for r in json.loads((cold/root/'descriptor-1/SYNC-MANIFEST.json').read_bytes()):
              b=(cold/r['path']).read_bytes();assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
          result=json.loads((cold/root/'closure-1/DECISION.json').read_bytes())
          print('CLOSURE_DECISION='+json.dumps({k:v for k,v in result.items() if k not in ('qualification','factual_fields')}))
          print('CALL_PATH='+ (cold/root/'closure-1/PLANNER-CALL-PATH.json').read_text())
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record cold-read Hand call-path and capsule byte identities'
          git push origin HEAD:refs/heads/$branch
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)"
      - name: Reject incomplete delivery
        if: always() && steps.closure.outcome != 'success'
        run: exit 3
