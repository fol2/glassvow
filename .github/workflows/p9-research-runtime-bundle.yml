name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
jobs:
  bundle:
    name: Repair native draw-order reader and cold-rebuild existing capture - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
      - name: Execute the bounded readout repair on unchanged complete bytes
        id: readout
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:$STUDY/reader-repair-1/repair.py)" = 3ebd76bf04c51a6a0537c87cec220fdcc9bc9027
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          python3 "$STUDY/reader-repair-1/repair.py" run "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/reader-repair-1/execution-1" > "$RUNNER_TEMP/reader-repair.log" 2>&1
      - name: Preserve real result or failure without changing original capture
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,sys
          root=pathlib.Path(os.environ['STUDY']);out=root/'reader-repair-1/execution-1';out.mkdir(exist_ok=True)
          shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/'reader-repair.log',out/'EXECUTION.log')
          if not (out/'RESULTS.json').exists():
              (out/'FAILURE.json').write_text(json.dumps({'status':'INCONCLUSIVE','new_native_runs':0,'p9_certified':False})+'\n')
          records=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file() and p.name!='FILES.json']
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          sys.path.insert(0,str(root.resolve()));import study
          study.publish(pathlib.Path('.').resolve(),out.resolve(),os.environ['PUBLISHED_HEAD'],'research(p9): preserve actual Hand readout correction and unchanged raw identities')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
      - name: Reconstruct corrected result from independent remote checkout
        if: steps.readout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cold rev-parse HEAD)" = "$PUBLISHED_HEAD"
          python3 "$STUDY/reader-repair-1/repair.py" verify "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/reader-repair-1/execution-1" "$GITHUB_WORKSPACE/cold/$STUDY/reader-repair-1/execution-1" "$GITHUB_WORKSPACE/$STUDY/reader-repair-1/execution-1/REMOTE-READBACK.json"
          python3 - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ['STUDY']);out=root/'reader-repair-1/execution-1'
          assert (root/'reader-repair-1/repair.py').read_bytes()==(pathlib.Path('cold')/root/'reader-repair-1/repair.py').read_bytes()
          sys.path.insert(0,str(root.resolve()));import study
          study.publish(pathlib.Path('.').resolve(),out.resolve(),os.environ['PUBLISHED_HEAD'],'research(p9): record cold-read Hand adaptive qualification without native replay')
          print((out/'RESULTS.json').read_text())
          PY
      - name: Reject incomplete repaired evidence
        if: always() && steps.readout.outcome != 'success'
        run: exit 3
