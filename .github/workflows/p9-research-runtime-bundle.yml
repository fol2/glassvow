name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/adaptive-value-v1
jobs:
  bundle:
    name: Fixed two-slope Hand adaptive value and verified terminal
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    # Operational containment for two conditional vows, four capped worlds and readback.
    # Per-native-call 240s and per-world/vow 3600 CPU seconds remain unchanged.
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: research/p9-six-route
      - name: Test exact source bytes and freeze the single scientific contract
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          expected={'campaign.py':'aa1ed7d8d3e07f31644afb14254adcb128ae2774','readout.py':'f9e3aea4e7208febffd8fd69a6ff6de28f445e93','test_campaign.py':'bedc0c89462ce1960f0a1c873e5fca231804b2fa'}
          for name,digest in expected.items():
              b=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==digest,name
              compile(b,str(root/name),'exec')
          PY
          (cd "$STUDY" && python3 -m unittest -v test_campaign) > "$STUDY/source-tests.log" 2>&1
          python3 "$STUDY/campaign.py" freeze "$GITHUB_WORKSPACE"
      - name: Execute the fixed stages once using the pinned stable native engine
        id: native
        if: steps.freeze.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
          engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$engine"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
          python3 "$STUDY/campaign.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/two-slope-value-work"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && steps.freeze.outcome == 'success' && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Cold-read every captured byte and reproduce the exact primary decision
        id: readback
        if: always() && steps.freeze.outcome == 'success' && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/campaign.py" verify "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$GITHUB_WORKSPACE/cold/$STUDY/execution-1" "$GITHUB_WORKSPACE/$STUDY/execution-1/REMOTE-READBACK.json"
          python3 "$STUDY/campaign.py" close "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && steps.readback.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route
      - name: Verify committed source, terminal and current capsule together
        if: always() && steps.readback.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$STUDY/campaign.py" verify-closure "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/closure-1/REMOTE-READBACK.json"
      - name: Keep delivery failure separate from the scientific verdict
        if: always() && (steps.freeze.outcome != 'success' || steps.native.outcome != 'success' || steps.readback.outcome != 'success')
        run: exit 3
