name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/acceptance-scope-20260911
jobs:
  bundle:
    name: Bind finite inference limits and complete current capsule - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/p9-research-runtime-bundle.yml
            /docs/balance/p9-strategy-diversity-system.md
            /research/p9-six-route/acceptance-scope-20260911/
            /research/p9-six-route/ash-inheritance-20260909/nightsight-opportunity-v1/
            /research/p9-six-route/ash-inheritance-20260909/hand-value-v1/execution-1/TERMINAL.json
            /research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/adaptive-value-v1/execution-1/TERMINAL.json
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Test the finite counterexample and bind unchanged authority and closed results
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['STUDY'])
          for name,want in {'scope.py':'dbf8ae99c3c7483931a28a0419ae7892c82573d2','close.py':'3d1899d32f4ca6650574d3e09d510ab237faeca0'}.items():
              b=(root/name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==want,name
          assert not (root/'execution-1').exists() and not (root/'closure-1').exists()
          PY
          python3 "$STUDY/scope.py" --self-test > "$RUNNER_TEMP/scope-tests.log" 2>&1
          python3 "$STUDY/scope.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/execution-1" > "$RUNNER_TEMP/scope-run.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY'])/'execution-1'
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('scope-*.log'):shutil.copyfile(p,root/p.name)
          (root/'FILES.json').write_text(json.dumps([{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file() and p.name!='FILES.json'],indent=2)+'\n')
          PY
          python3 "$STUDY/close.py" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$STUDY/closure-1" > "$RUNNER_TEMP/scope-close.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['STUDY'])/'closure-1'
          p=root/'scope-close.log';shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/p.name,p)
          records=json.loads((root/'FILES.json').read_bytes())
          for p in [p,pathlib.Path('.github/workflows/p9-research-runtime-bundle.yml')]:
              b=p.read_bytes();records.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})
          (root/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Preserve complete decision and current summaries or actual failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ '${{ steps.analysis.outcome }}' = success ]; then
            git add "$STUDY/execution-1" "$STUDY/closure-1" research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md research/p9-six-route/package-disposition-20260908/ROADMAP.md
          else
            mkdir "$STUDY/delivery-2"
            cp "$RUNNER_TEMP"/scope-*.log "$STUDY/delivery-2/" 2>/dev/null || true
            printf '%s\n' '{"status":"INFERENCE_SCOPE_DELIVERY_INCOMPLETE","new_native_runs":0,"packages_admitted":0,"p9_certified":false}' > "$STUDY/delivery-2/TERMINAL.json"
            for part in execution-1 closure-1; do
              if [ -d "$STUDY/$part" ]; then cp -a "$STUDY/$part" "$STUDY/delivery-2/partial-$part"; fi
            done
            git add "$STUDY/delivery-2"
          fi
          python3 - <<'PY'
          import os,subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          shared={'research/p9-six-route/'+n for n in ('SESSION-STATE.json','SESSION-HANDOFF.md','package-disposition-20260908/ROADMAP.md')}
          assert names and all(n in shared or n.startswith(os.environ['STUDY']+'/') for n in names)
          PY
          git commit -m 'research(p9): preserve finite inference limit and synchronized verified frontier'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.analysis.outcome == 'success'
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/p9-research-runtime-bundle.yml
            /docs/balance/p9-strategy-diversity-system.md
            /research/p9-six-route/acceptance-scope-20260911/
            /research/p9-six-route/ash-inheritance-20260909/hand-value-v1/execution-1/TERMINAL.json
            /research/p9-six-route/ash-inheritance-20260909/hand-two-slope-v1/adaptive-value-v1/execution-1/TERMINAL.json
            /research/p9-six-route/SESSION-STATE.json
            /research/p9-six-route/SESSION-HANDOFF.md
            /research/p9-six-route/package-disposition-20260908/ROADMAP.md
      - name: Read every published byte from a separate checkout and reconstruct the same finite result
        if: steps.analysis.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE']);cold=repo/'cold';rel=pathlib.Path(os.environ['STUDY']);folder=rel/'closure-1'
          raw=(repo/folder/'FILES.json').read_bytes();assert raw==(cold/folder/'FILES.json').read_bytes()
          files=json.loads(raw);assert len({r['path'] for r in files})==len(files)
          for r in files:
              p=pathlib.Path(r['path']);assert not p.is_absolute() and '..' not in p.parts
              b=(cold/p).read_bytes();oid=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert b==(repo/p).read_bytes() and len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256'] and oid==r['git_blob']
              assert subprocess.check_output(['git','-C',str(cold),'rev-parse','HEAD:'+str(p)]).decode().strip()==oid
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'scope-offline-reconstruction'
          p=subprocess.run([sys.executable,str(cold/rel/'scope.py'),str(cold),str(dest)],capture_output=True,timeout=120,check=False)
          assert p.returncode==0,p.stderr.decode(errors='replace')
          for name in ('WITNESS.json','DECISION.json'):assert (dest/name).read_bytes()==(cold/rel/'execution-1'/name).read_bytes(),name
          receipt={'kind':'AVAILABILITY_AND_INFERENCE_SCOPE_COLD_READBACK','published_head':os.environ['PUBLISHED_HEAD'],'files':files,'all_bytes_equal':True,'finite_counterexample_reproduced':True,'earlier_scope_receipts_retained':True,'new_native_runs':0,'new_independent_samples':0,'packages_admitted':0,'p9_certified':False}
          (repo/folder/'REMOTE-READBACK.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/closure-1/REMOTE-READBACK.json"
          test "$(git diff --cached --name-only)" = "$STUDY/closure-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): record cold byte readback of inference decision and current capsule'
          git push origin HEAD:refs/heads/$branch
      - name: Fail closed on actual offline analysis failure
        if: always() && steps.analysis.outcome != 'success'
        run: exit 3
