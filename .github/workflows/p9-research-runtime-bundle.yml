name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/planner-v1/float-fastpath-v1
jobs:
  bundle:
    name: Exact float-domain proof and four fixed-cell implementation timings
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            .github
            content
            research/p9-six-route/ash-inheritance-20260909
      - name: Verify committed source and reject false timing promotions before native work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY']);freeze=json.loads((root/'SOURCE-FREEZE.json').read_bytes())
          for name,digest in freeze['sources'].items():
              path=root/name;data=path.read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,name
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==subprocess.check_output(['git','rev-parse','HEAD:'+str(path)]).decode().strip(),name
          assert subprocess.check_output(['git','rev-parse','HEAD:'+str(root/'PROTOCOL.json')]).decode().strip()==freeze['protocol_git_blob']
          assert not (root/'execution-1').exists()
          PY
          (cd "$STUDY" && python3 -m unittest -v test_refine) > "$RUNNER_TEMP/float-tests.log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Run actual controller conversion proof and only the fixed benchmark
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
          } > "$RUNNER_TEMP/float-engine.log" 2>&1
          python3 "$STUDY/experiment.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/float-work" --publish > "$RUNNER_TEMP/float-run.stdout" 2> "$RUNNER_TEMP/float-run.stderr"
      - name: Preserve all available diagnostics and the actual terminal
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          out=pathlib.Path(os.environ['STUDY'])/'execution-1';out.mkdir(parents=True,exist_ok=True)
          for name in ['float-tests.log','float-engine.log','float-run.stdout','float-run.stderr']:
              p=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              if p.exists():shutil.copyfile(p,out/name)
          if not (out/'TERMINAL.json').exists():
              (out/'TERMINAL.json').write_text(json.dumps({'status':'INCONCLUSIVE','failure':'ENTRY_OR_ENGINE_DELIVERY_FAILURE','packages_admitted':0,'p9_certified':False},indent=2)+'\n')
          rows=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'FILES.json']
          (out/'FILES.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add -f "$STUDY/execution-1"
          git commit -m 'research(p9): retain complete actual float benchmark diagnostics'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            content
            research/p9-six-route/ash-inheritance-20260909
      - name: Cold-read every source and capture byte; rebuild the actual decision
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')
          for name in ['PROTOCOL.json','SOURCE-FREEZE.json','refine.py','numeric_gate.gd','experiment.py','test_refine.py']:
              assert (root/name).read_bytes()==(cold/root/name).read_bytes(),name
          PY
          python3 "cold/$STUDY/experiment.py" verify "$GITHUB_WORKSPACE/cold" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$GITHUB_WORKSPACE/cold/$STUDY/execution-1" "$GITHUB_WORKSPACE/$STUDY/execution-1/REMOTE-READBACK.json"
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$PUBLISHED_HEAD"
          git add "$STUDY/execution-1/REMOTE-READBACK.json"
          git commit -m 'research(p9): retain complete cold byte proof of float refinement'
          git push origin HEAD:refs/heads/$branch
      - name: Keep delivery and scientific conclusions separate
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(os.environ['STUDY'])/'execution-1'
          terminal=json.loads((p/'TERMINAL.json').read_bytes())
          print(json.dumps(terminal,indent=2))
          sys.exit(3 if terminal['status']=='INCONCLUSIVE' else 0)
          PY
