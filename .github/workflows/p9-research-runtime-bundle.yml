name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/minimal-v1/screen-v1
jobs:
  bundle:
    name: Verify already complete Bloodfire screen - no engine
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            .github
            research/p9-six-route/ash-inheritance-20260909
            research/p9-six-route/guardrail-confirmation-20260909
            research/p9-six-route/package-disposition-20260908
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github
            research/p9-six-route/ash-inheritance-20260909
            research/p9-six-route/guardrail-confirmation-20260909
      - name: Reproduce serialization defect, then verify unchanged raw and result
        shell: bash
        run: |
          set -euo pipefail
          echo "fecf73d862813f082d49d819eba10059df5987b03685d2215291df7ca499a50a  $STUDY/readback_fix.py" | sha256sum -c -
          mkdir "$STUDY/readback-1"
          python3 "$STUDY/readback_fix.py" --self-test > "$STUDY/readback-1/tests.stdout" 2> "$STUDY/readback-1/tests.stderr"
          python3 "$STUDY/readback_fix.py" cold "$STUDY/execution-1" "cold/$STUDY/execution-1" "$STUDY/readback-1/REMOTE-READBACK.json" > "$STUDY/readback-1/verify.stdout" 2> "$STUDY/readback-1/verify.stderr"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path(os.environ['STUDY']);items=[]
          for name in ['screen.py','test_screen.py','PROTOCOL.json','readback_fix.py']:
              p=r/name;b=p.read_bytes();assert (pathlib.Path('cold')/p).read_bytes()==b
              items.append({'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (r/'readback-1/SOURCE-READBACK.json').write_text(json.dumps({'source_head':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':items,'native_runs':0},indent=2)+'\n')
          receipt=json.loads((r/'readback-1/REMOTE-READBACK.json').read_bytes())
          state_path=pathlib.Path('research/p9-six-route/SESSION-STATE.json')
          state=json.loads(state_path.read_bytes());before=dict(state)
          assert state['packages_admitted']==0 and not state['p9_certified']
          next_action='Complete the current minimum Bloodfire plus unchanged Hand proof under one source-bound causal/descriptor/policy/peer/economy contract. Preserve inherited identities but do not carry historical population outcomes. The passed preflight and signed-control screen are closed inputs; do not rerun either, v25, Hand support, aliases or bulk tuning. Additional P9 slots remain unresolved.'
          state['status']='P9_UNFINISHED_MINIMUM_BLOODFIRE_SIGNED_SCREEN_PASS'
          state['exact_next_action']=next_action
          state['bloodfire_minimal']={'preflight':'BLOODFIRE_MINIMAL_PREFLIGHT_PASS','source_head':'10587e242a5dcc83fad5ae47e1ce31965c999fae','capture':'ash-inheritance-20260909/minimal-v1/execution-1','raw_remote_verified':True}
          p=json.loads((r/'execution-1/RESOLVED-PROTOCOL.json').read_bytes())
          state['bloodfire_signed_screen']={'status':receipt['scientific_status'],'rows':receipt['rows'],'source_head':'1c6c139ad7f91fb733d6a5abc6ee804a92aa9e8d','candidate_content_sha256':p['content_sha256']['candidate'],'candidate_combat_sha256':p['combat_sha256']['candidate'],'result_sha256':receipt['result_sha256'],'readback':'ash-inheritance-20260909/minimal-v1/screen-v1/readback-1/REMOTE-READBACK.json','grids':receipt['grids'],'new_package_admissions':0,'historical_outcomes_carried':False}
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          changed=[k for k in before if before[k]!=state.get(k)]
          assert set(changed)<= {'status','exact_next_action'}
          (r/'readback-1/STATE-PRESERVATION.json').write_text(json.dumps({'changed_existing_keys':changed,'other_existing_values_preserved':True},indent=2)+'\n')
          handoff=pathlib.Path('research/p9-six-route/SESSION-HANDOFF.md')
          old=handoff.read_text()
          addition='# Current frontier: minimum Bloodfire signed-control screen passed\n\nThe complete minimum Bloodfire preflight and its 1,024-row signed arm2 screen have passed their scoped gates, with full remote byte readback. Do not repeat them. The initial readback object comparison failed because integer Counter keys become JSON string keys; the unchanged result now reproduces exact serialized bytes. Read ash-inheritance-20260909/minimal-v1/screen-v1/readback-1/REMOTE-READBACK.json.\n\n'+next_action+'\n\nP9 remains unfinished, 0/6 full current certificates. Main is unchanged. The earlier source-alias decisions and all historical limits below remain valid; their earlier next-action paragraph is superseded by the current frontier above.\n\n---\n\n'
          handoff.write_text(addition+old)
          print(json.dumps(receipt,indent=2))
          PY
      - name: Commit evidence and current capsule on the existing branch
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STUDY/readback-1" research/p9-six-route/SESSION-STATE.json research/p9-six-route/SESSION-HANDOFF.md
          git commit -m 'research(p9): close passed Bloodfire screen and remove stale recovery instructions'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: final
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/minimal-v1/screen-v1
      - name: Read back the new receipt and capsule themselves
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path(os.environ['STUDY']);paths=[p for p in (r/'readback-1').rglob('*') if p.is_file()]
          paths += [pathlib.Path('research/p9-six-route/SESSION-STATE.json'),pathlib.Path('research/p9-six-route/SESSION-HANDOFF.md')]
          for p in paths:assert p.read_bytes()==(pathlib.Path('final')/p).read_bytes(),str(p)
          print('FINAL_RECEIPT_AND_CAPSULE_READBACK='+json.dumps({'head':os.environ['PUBLISHED_HEAD'],'files':len(paths),'all_equal':True,'new_native_runs':0}))
          PY
