name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  STUDY: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
jobs:
  bundle:
    name: Hand adaptive intervention seam and named clone mutants - no population
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1/
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/FILES.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/SOURCE-MANIFEST.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/REMOTE-READBACK.json
            /research/p9-six-route/ash-inheritance-20260909/joint-controller-v1/execution-1/runtime-source.tar.xz
      - name: Check committed source identities and reader regressions before native observations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$STUDY/execution-1"
          echo "PUBLISHED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['STUDY'])
          f=json.loads((root/'FREEZE.json').read_bytes())
          for n,expected in f['source_sha256'].items():
              b=(root/n).read_bytes()
              assert hashlib.sha256(b).hexdigest()==expected,n
              actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual==subprocess.check_output(['git','rev-parse','HEAD:'+str(root/n)]).decode().strip(),n
          assert f['native_observations_at_freeze']==0
          PY
          (cd "$STUDY" && python3 -m unittest -v test_build test_read_gate) > "$RUNNER_TEMP/hand-tests.log" 2>&1
      - name: Execute the fixed qualification once with the pinned engine
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            curl --fail --location --max-time 90 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
            engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
            chmod +x "$engine"
            echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $engine" | sha256sum -c -
            "$engine" --version
          } > "$RUNNER_TEMP/hand-engine.log" 2>&1
          python3 "$STUDY/study.py" run "$GITHUB_WORKSPACE" "$engine" "$GITHUB_WORKSPACE/$STUDY/execution-1" "$RUNNER_TEMP/hand-work" > "$RUNNER_TEMP/hand-run.log" 2>&1
      - name: Preserve actual diagnostics and unchanged source bytes
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,sys
          root=pathlib.Path(os.environ['STUDY']);out=root/'execution-1';out.mkdir(exist_ok=True)
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('hand-*.log'):
              shutil.copyfile(p,out/p.name)
          if not (out/'TERMINAL.json').exists():
              (out/'TERMINAL.json').write_text(json.dumps({'status':'INCONCLUSIVE','failure':'Read preserved delivery logs','packages_admitted':0,'p9_certified':False})+'\n')
          records=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='FILES.json']
          (out/'FILES.json').write_text(json.dumps(records,indent=2)+'\n')
          sys.path.insert(0,str(root.resolve()));import study
          study.publish(pathlib.Path('.').resolve(),out.resolve(),os.environ['PUBLISHED_HEAD'],'research(p9): preserve Hand qualification logs and complete source-bound capture')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: always() && env.PUBLISHED_HEAD != ''
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/ash-inheritance-20260909/hand-adaptive-v1
      - name: Cold-read all output bytes and reconstruct the exact decision without an engine
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cold rev-parse HEAD)" = "$PUBLISHED_HEAD"
          python3 "$STUDY/study.py" verify "$GITHUB_WORKSPACE/$STUDY/execution-1" "$GITHUB_WORKSPACE/cold/$STUDY/execution-1" "$GITHUB_WORKSPACE/$STUDY/execution-1/REMOTE-READBACK.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path(os.environ['STUDY']);cold=pathlib.Path('cold')/root
          files=[]
          for p in sorted(root.glob('*')):
              if not p.is_file():continue
              b=p.read_bytes();assert b==(cold/p.name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual==subprocess.check_output(['git','-C','cold','rev-parse','HEAD:'+str(p)]).decode().strip()
              files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'git_blob':actual})
          (root/'execution-1/SOURCE-READBACK.json').write_text(json.dumps({'published_head':os.environ['PUBLISHED_HEAD'],'files':files,'all_bytes_equal':True},indent=2)+'\n')
          sys.path.insert(0,str(root.resolve()));import study
          study.publish(pathlib.Path('.').resolve(),(root/'execution-1').resolve(),os.environ['PUBLISHED_HEAD'],'research(p9): record exact remote Hand capture and source readback')
          PY
      - name: Report qualification separately from package admission
        if: always() && env.PUBLISHED_HEAD != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['STUDY'])/'execution-1/TERMINAL.json'
          t=json.loads(p.read_bytes());print(json.dumps(t,indent=2))
          if t['status']=='INCONCLUSIVE':raise SystemExit(3)
          PY
