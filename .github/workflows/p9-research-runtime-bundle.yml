name: P9 research runtime bundle
on:
  push:
    branches: [research/p9-six-route-local-20260905]
    paths: [.github/workflows/p9-research-runtime-bundle.yml]
permissions:
  contents: read
concurrency:
  group: p9-six-route-research-writer
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bundle:
    name: Recover precise historical laws - no engine or outcome rows
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            domain
            content
            research/p9-six-route/smolder-certificate-20260909
      - name: Extract complete pinned functions, never execute archived code
        shell: bash
        run: |
          set -euo pipefail
          study=research/p9-six-route/smolder-certificate-20260909
          echo '2e684ac71e143a5d7ac86836e242e1903a0e8abdcf1dfa47e9ac1b472034d57c  research/p9-six-route/smolder-certificate-20260909/source_scope.py' | sha256sum -c -
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/fol2/glassvow/c802be36510273481b6d0f865b92fac43abf6aff/research/issue-421/raw/post-directive-harness-v2.tar.gz --output "$RUNNER_TEMP/history.tar.gz"
          python3 "$study/source_scope.py" . "$RUNNER_TEMP/history.tar.gz" "$study/source-1"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/p9-six-route/smolder-certificate-20260909/source-1/HISTORICAL-FUNCTIONS.json')
          for name,record in json.loads(p.read_bytes()).items():
              if '::' not in name:continue
              lines=record['body'].splitlines()
              picks=set()
              for i,line in enumerate(lines):
                  if 'mistbound' in line.lower() or 'bloodfire' in line.lower():
                      picks.update(range(max(0,i-5),min(len(lines),i+9)))
              if picks:
                  print('HISTORICAL_FUNCTION',name,record['sha256'])
                  for i in sorted(picks):print(str(i+1)+':'+lines[i])
          PY
      - name: Commit extracted source evidence on existing branch
        shell: bash
        run: |
          set -euo pipefail
          branch=research/p9-six-route-local-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git add research/p9-six-route/smolder-certificate-20260909/source-1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(p9): preserve native and historical complete function identities'
          git push origin HEAD:refs/heads/$branch
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLISHED_HEAD }}
          path: cold
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: research/p9-six-route/smolder-certificate-20260909
      - name: Verify remote bytes including executed extractor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('research/p9-six-route/smolder-certificate-20260909')
          result=[]
          for path in sorted(root.rglob('*')):
              if not path.is_file():continue
              data=path.read_bytes(); other=pathlib.Path('cold')/path
              assert other.read_bytes()==data,str(path)
              digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert digest==subprocess.check_output(['git','rev-parse','HEAD:'+str(path)]).decode().strip()
              result.append({'path':str(path),'bytes':len(data),'git_blob':digest,'sha256':hashlib.sha256(data).hexdigest()})
          print('REMOTE_SOURCE_READBACK='+json.dumps(result,sort_keys=True))
          PY
