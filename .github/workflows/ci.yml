name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      
      - name: Import assets
        run: tools/check_imports.sh

      - name: Test asset import gate failures
        run: tools/test_check_imports.sh
      
      # `--check-only` exits 0 on every parse error and reports only on stderr,
      # so the loop that stood here could never fail. The script grades stderr
      # and process status; AGENTS.md calls the same gate so local and CI agree.
      - name: Check GDScript syntax
        run: tools/check_scripts.sh

      - name: Test GDScript gate failures
        run: tools/test_check_scripts.sh
      
      - name: Run tests
        run: godot --headless -s res://tests/run_all.gd
