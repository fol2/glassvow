name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      
      - name: Import assets
        run: tools/check_imports.sh

      - name: Test asset import gate failures
        run: tools/test_check_imports.sh
      
      # `--check-only` exits 0 on every parse error and reports only on stderr,
      # so the loop that stood here could never fail. The script grades stderr
      # and process status; AGENTS.md calls the same gate so local and CI agree.
      - name: Check GDScript syntax
        run: tools/check_scripts.sh

      - name: Test GDScript gate failures
        run: tools/test_check_scripts.sh

      - name: Check zh-Hant bundled font coverage
        run: |
          python3 -m pip install 'fonttools[woff]>=4.63,<4.64'
          python3 -B tools/check_locale_font_coverage.py

      # English ContentDB copy is baked in content/full-content.json while
      # zh-Hant overlays from locale/zh-Hant.json.  This gate follows that
      # runtime path rather than comparing the two locale bundles alone.
      - name: Check narrative locale coverage
        run: |
          python3 -B tools/check_locale_coverage.py --self-test
          python3 -B tools/check_locale_coverage.py

      - name: Check store Dev-tree exclusion
        run: python3 tools/check_store_dev_exclusion.py

      - name: Test store Dev-tree exclusion gate
        run: tools/test_check_store_dev_exclusion.sh

      - name: Check developer-tool registry and coordinate conversion
        run: python3 -B tools/dev.py --check

      # The web-reference twin used to be excluded from CI on purpose: it
      # resolved citations against the roguecardv2-benchmark checkout and
      # returned 2 — "benchmark tree not found" — wherever that was absent,
      # which is every runner here. It was deleted on 2026-08-16 with the
      # detachment (#317, #325), and the gate below replaces it by counting
      # citations instead of resolving them, so it needs no checkout and runs
      # where the rule is actually broken.
      - name: Check doc file:line anchors
        run: python3 -B tools/check_anchors.py

      - name: Check no new web-reference citations
        run: python3 -B tools/check_benchmark_freeze.py

      # Map tile/module gates (#207 repairs 7–9, #234 slice 5). `--self-test`
      # proves the checker can fail against generated fixtures; empty-dir is
      # the production state until tiles exist (`assets/art/map/` is absent).
      # A green empty run without --self-test would be the same silent-pass
      # disease as grading `--check-only` by its exit code.
      - name: Check map tile and module assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python3 -m pip install --quiet 'Pillow>=10,<13'
          python3 -B tools/check_map_assets.py --self-test
          xvfb-run -a python3 -B tools/check_map_assets.py

      - name: Test performance evidence replay
        run: python3 -B tests/test_performance_budget.py
      
      - name: Run tests
        run: godot --headless -s res://tests/run_all.gd

      - name: Test phone-landscape scroll reachability
        run: godot --headless -s res://tests/choice_scroll_reachability.gd

      - name: Test boss-relic phone containment
        run: godot --headless -s res://tests/boss_relic_choice_containment.gd

      - name: Test Dawn phone containment
        run: godot --headless -s res://tests/dawn_phone_containment.gd

      - name: Test run HUD location fit
        run: godot --headless -s res://tests/measure_hud_location.gd
