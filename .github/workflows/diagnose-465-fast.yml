name: Diagnose issue 465 geometry contract

on:
  push:
    branches:
      - work/465-asset-profile-authority
    paths:
      - '.github/workflows/diagnose-465-fast.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/465-asset-profile-authority
          fetch-depth: 0

      - name: Rebase diagnostic onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Generate candidate
        run: |
          rm -f tools/_patch_465_geometry_failure.txt
          grep -q 'reads `_seat_kit` rather' tools/_patch_465_scene.py
          sed -i 's/reads `_seat_kit` rather/reads `seat_kit` rather/' tools/_patch_465_scene.py
          python3 tools/_patch_465_data.py
          python3 tools/_patch_465_scene.py
          python3 tools/_patch_465_probe.py
          python3 tools/_patch_465_review.py
          git diff --check

      - name: Import resources and register classes
        run: tools/check_imports.sh

      - name: Capture exact geometry assertion
        run: |
          cat > /tmp/run_465_focus.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var script: Script = load("res://tests/test_map_asset_profiles.gd") as Script
              if script == null:
                  print("run_465_focus: failed to load focused test")
                  quit(2)
                  return
              var fails: Array[String] = []
              script.call("_geometry_contract", fails)
              if fails.is_empty():
                  print("PASS _geometry_contract")
                  quit(0)
                  return
              print("FAIL _geometry_contract (%d)" % fails.size())
              for message: String in fails:
                  print("  - %s" % message)
              quit(1)
          GDSCRIPT
          set +e
          godot --headless --path . --script /tmp/run_465_focus.gd 2>&1 | tee /tmp/geometry.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            cp /tmp/geometry.log tools/_patch_465_geometry_failure.txt
            git add tools/_patch_465_geometry_failure.txt
            git commit -m 'ci(#465): capture geometry contract failure'
            git push --force-with-lease origin HEAD:work/465-asset-profile-authority
          fi
          exit "$rc"
